*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif;overflow-x:hidden}

const uid=()=>"id_"+Math.random().toString(36).slice(2,10);
const p2c=(cx,cy,r,d)=>{const rad=(d-90)*(Math.PI/180);return[cx+r*Math.cos(rad),cy+r*Math.sin(rad)]};
const aP=(cx,cy,rO,rI,s,e)=>{const[a,b]=p2c(cx,cy,rO,s),[c,d]=p2c(cx,cy,rO,e),[f,g]=p2c(cx,cy,rI,e),[h,j]=p2c(cx,cy,rI,s),l=e-s>180?1:0;return`M${a},${b} A${rO},${rO} 0 ${l},1 ${c},${d} L${f},${g} A${rI},${rI} 0 ${l},0 ${h},${j} Z`};

const SK="vuosikello_v6";
const sv=d=>{try{localStorage.setItem(SK,JSON.stringify(d))}catch{}};
const ld=()=>{try{const r=localStorage.getItem(SK);if(r){const d=JSON.parse(r);if(Array.isArray(d)&&d.length)return d}}catch{};return null};
const encS=c=>{try{return LZString.compressToEncodedURIComponent(JSON.stringify({name:c.name,events:c.events,categories:c.categories,settings:c.settings}))}catch{return null}};
const decS=s=>{try{const j=LZString.decompressFromEncodedURIComponent(s);if(j){const d=JSON.parse(j);if(d.name)return d}}catch{};return null};

/* ═══ Mini Clock Preview ═══ */
function MiniClock({categories,events,size:sz}){
  const s=sz||100,cx=s/2,cy=s/2,iR=s*.16,rS=s*.22,rG=1;
  const rW=(s/2-rS-3)/Math.max(categories.length,1)-rG;
  return(<svg viewBox={`0 0 ${s} ${s}`} width={sz} height={sz}>
    {categories.map((cat,ri)=>{const rO=rS+(ri+1)*(rW+rG)-rG,rI=rS+ri*(rW+rG);
      return(<g key={ri}>{Array.from({length:12},(_,mi)=>{const has=events.some(e=>e.month===mi&&e.categoryId===cat.id);
        return<path key={mi} d={aP(cx,cy,rO,rI,mi*30,(mi+1)*30)} fill={cat.color} opacity={has?.7:.25} stroke="#fff" strokeWidth=".5"/>})}</g>)})}
    <circle cx={cx} cy={cy} r={rS} fill="#f8fafc" stroke="#e2e8f0" strokeWidth=".5"/>
    <circle cx={cx} cy={cy} r={iR} fill="#fff"/>
    {events.slice(0,15).map((ev,i)=>{const cat=categories.find(c=>c.id===ev.categoryId);if(!cat)return null;
      const ri=categories.indexOf(cat),rI2=rS+ri*(rW+rG)+1,rO2=rS+(ri+1)*(rW+rG)-rG-1,rM=(rI2+rO2)/2;
      const[x,y]=p2c(cx,cy,rM,ev.month*30+15);
      return<circle key={i} cx={x} cy={y} r={Math.max(1.2,rW/4)} fill={ev.eventColor||"#fff"} opacity=".9"/>;
    })}
  </svg>);
}

/* ═══ Onboarding ═══ */

          {TEMPLATES.map(t=>(
            <button key={t.id} onClick={()=>go(t)} style={{padding:"18px 14px",borderRadius:14,border:"1.5px solid #e2e8f0",background:"#fff",cursor:"pointer",textAlign:"center",fontFamily:"inherit",transition:"all .2s",display:"flex",flexDirection:"column",alignItems:"center"}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor="#5B5EA6";e.currentTarget.style.boxShadow="0 4px 20px rgba(91,94,166,.12)"}}

              <MiniClock categories={t.categories} events={t.events} size={100}/>
              <div style={{fontWeight:800,fontSize:13,marginTop:10}}>{t.name}</div>
              <div style={{fontSize:10,color:"#94a3b8",marginTop:3}}>{t.desc}</div>
              <div style={{fontSize:9,color:"#cbd5e1",marginTop:6}}>{t.categories.length} kehää · {t.events.length} tapahtumaa</div>
            </button>
          ))}

  return(<div style={{minHeight:"100vh",background:"#f0f2f5",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div style={{background:"#fff",borderRadius:20,padding:"32px 28px",maxWidth:500,width:"100%",boxShadow:"0 4px 24px rgba(0,0,0,.06)",animation:"fadeIn .3s"}}>
      <button onClick={()=>setView("gallery")} style={{background:"none",border:"none",color:"#5B5EA6",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:14,padding:0}}>← Takaisin</button>
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:20}}>
        <MiniClock categories={sel.categories} events={sel.events} size={70}/>
        <div><h2 style={{fontSize:18,fontWeight:800,margin:0}}>{sel.name}</h2><div style={{fontSize:12,color:"#94a3b8"}}>{sel.desc}</div></div>
      </div>
      <label style={lbl}>Nimi</label>
      <input value={name} onChange={e=>setName(e.target.value)} placeholder="Vuosikellon nimi" style={{...inp,fontSize:15}} autoFocus/>

      <label style={lbl}>Kellon tyyppi</label>
      <div style={{display:"flex",marginBottom:12,borderRadius:8,overflow:"hidden",border:"1.5px solid #e2e8f0"}}>
        {[{v:true,l:"Pyörivä"},{v:false,l:"Staattinen"}].map(o=><button key={String(o.v)} onClick={()=>setSett({...sett,revolving:o.v})} style={{flex:1,padding:"9px",border:"none",fontSize:12,fontWeight:700,fontFamily:"inherit",cursor:"pointer",background:sett.revolving===o.v?"#5B5EA6":"#f8fafc",color:sett.revolving===o.v?"#fff":"#64748b"}}>{o.l}</button>)}
      </div>

      <label style={lbl}>Suunta</label>
      <div style={{display:"flex",marginBottom:12,borderRadius:8,overflow:"hidden",border:"1.5px solid #e2e8f0"}}>
        {[{v:true,l:"Myötäpäivään ↻"},{v:false,l:"Vastapäivään ↺"}].map(o=><button key={String(o.v)} onClick={()=>setSett({...sett,clockwise:o.v})} style={{flex:1,padding:"9px",border:"none",fontSize:12,fontWeight:700,fontFamily:"inherit",cursor:"pointer",background:sett.clockwise===o.v?"#5B5EA6":"#f8fafc",color:sett.clockwise===o.v?"#fff":"#64748b"}}>{o.l}</button>)}
      </div>

      <Toggle value={sett.showDates} onChange={v=>setSett({...sett,showDates:v})} label="Päivämäärärengas (ulkokehä)"/>

/* ═══ Circular Clock with all ring layers ═══ */
function CircularClock({events,categories,onMonthClick,onEventClick,clockTitle,selectedMonth,settings,theme:th,holidays}){
  const[hov,setHov]=useState(null);const[tip,setTip]=useState(null);const ref=useRef(null);
  const vc=categories.filter(c=>c.visible);
  const s=settings||DS;
  const cm=new Date().getMonth();
  const rOff=s.revolving?-(cm*30+15):-(s.startMonth*30);
  const dir=s.clockwise?1:-1;
  const mD=mi=>mi*30*dir+rOff;

  // Ring layout calculation
  const sz=820,cx=sz/2,cy=sz/2;
  const centerR=s.logo?55:50;
  const monthRingW=25;
  const catLabelW=12; // thin label ring
  const dataRingW=Math.min(48,(sz/2-centerR-monthRingW-10-(s.showDates?22:0))/Math.max(vc.length,1)-(catLabelW+3));
  const dateRingW=s.showDates?18:0;

  // Radii from inside out: center -> monthRing -> [catLabel+dataRing per category] -> dateRing
  const monthRI=centerR+8;
  const monthRO=monthRI+monthRingW;
  let nextR=monthRO+3;
  const rings=vc.map((cat,ri)=>{
    const labelRI=nextR;const labelRO=labelRI+catLabelW;
    const dataRI=labelRO+1;const dataRO=dataRI+dataRingW;
    nextR=dataRO+3;
    return{cat,ri,labelRI,labelRO,dataRI,dataRO};
  });
  const dateRI=nextR+2;const dateRO=dateRI+dateRingW;
  const outerR=s.showDates?dateRO:nextR;

  const cM=useMemo(()=>{const m={};vc.forEach((c,i)=>m[c.id]={...c,ri:i});return m},[vc]);
  const hMM=(e,ev)=>{if(!ref.current)return;const r=ref.current.getBoundingClientRect();setTip({x:e.clientX-r.left,y:e.clientY-r.top,ev})};
  const eRM=useMemo(()=>{const m={};events.forEach(ev=>{const c=cM[ev.categoryId];if(!c)return;const k=`${c.ri}-${ev.month}`;if(!m[k])m[k]=[];m[k].push(ev)});return m},[events,cM]);

  return(<div style={{position:"relative",width:"100%",maxWidth:sz,margin:"0 auto"}}>
    <svg ref={ref} viewBox={`0 0 ${sz} ${sz}`} style={{width:"100%",height:"auto",fontFamily:"'DM Sans',sans-serif"}} onMouseLeave={()=>setTip(null)}>
      <defs><filter id="bs"><feDropShadow dx="0" dy="1" stdDeviation="1.5" floodOpacity=".2"/></filter></defs>

      {/* Date ring (outermost) */}
      {s.showDates&&MF.map((_,mi)=>{
        const sd=mD(mi),ed=mD(mi)+30*dir,s2=Math.min(sd,ed),e2=Math.max(sd,ed);
        const days=DAYS_IN_MONTH[mi],weekSlice=(e2-s2)/Math.ceil(days/7);
        return(<g key={`dr${mi}`}>
          <path d={aP(cx,cy,dateRO,dateRI,s2,e2)} fill={th.cardAlt} stroke={th.border} strokeWidth=".5"/>
          {Array.from({length:Math.ceil(days/7)},(_,wi)=>{
            const ws=s2+wi*weekSlice,we=s2+(wi+1)*weekSlice,wm=(ws+we)/2;
            const dayStart=wi*7+1,dayEnd=Math.min((wi+1)*7,days);
            const[tx,ty]=p2c(cx,cy,(dateRI+dateRO)/2,wm);
            const rot=wm,fl=rot>90&&rot<270;
            return(<text key={wi} x={tx} y={ty} textAnchor="middle" dominantBaseline="central" fill={th.sub} fontSize="6" fontWeight="600"
              transform={`rotate(${fl?rot+180:rot},${tx},${ty})`}>{dayStart}-{dayEnd}</text>);
          })}
        </g>);
      })}

      {/* Month ring */}
      {MF.map((nm,mi)=>{
        const sd=mD(mi),ed=mD(mi)+30*dir,s2=Math.min(sd,ed),e2=Math.max(sd,ed);
        const isCur=mi===cm,isSel=mi===selectedMonth;
        return(<g key={`mr${mi}`}>
          <path d={aP(cx,cy,monthRO,monthRI,s2,e2)}
            fill={isSel?th.text+"22":isCur?"#5B5EA622":th.cardAlt}
            stroke={th.border} strokeWidth=".5" onClick={()=>onMonthClick(mi)} style={{cursor:"pointer"}}/>
          {(()=>{const md=(s2+e2)/2,[lx,ly]=p2c(cx,cy,(monthRI+monthRO)/2,md),rot=md,fl=rot>90&&rot<270;
            return<text x={lx} y={ly} textAnchor="middle" dominantBaseline="central" fill={isCur?"#5B5EA6":th.muted}
              fontSize="9" fontWeight={isCur?"800":"600"} transform={`rotate(${fl?rot+180:rot},${lx},${ly})`}
              onClick={()=>onMonthClick(mi)} style={{cursor:"pointer"}}>{MS[mi]}</text>})()}
        </g>);
      })}

      {/* Category label rings + data rings */}
      {rings.map(({cat,ri,labelRI,labelRO,dataRI,dataRO})=>(
        <g key={cat.id}>
          {/* Thin label ring - solid category color */}
          {MF.map((_,mi)=>{
            const sd=mD(mi),ed=mD(mi)+30*dir,s2=Math.min(sd,ed),e2=Math.max(sd,ed);
            return<path key={`lb${mi}`} d={aP(cx,cy,labelRO,labelRI,s2,e2)} fill={cat.color} opacity=".6" stroke={th.card} strokeWidth=".5"/>;
          })}
          {/* Label text (one curved text across bottom) */}
          {(()=>{const rM=(labelRI+labelRO)/2,pid=`cl${ri}`;
            const la=mD(6.5),lb=mD(8),s2=Math.min(la,lb),e2=Math.max(la,lb);
            const[sx2,sy2]=p2c(cx,cy,rM,s2),[ex2,ey2]=p2c(cx,cy,rM,e2);
            return(<g><defs><path id={pid} d={`M${sx2},${sy2} A${rM},${rM} 0 0,1 ${ex2},${ey2}`} fill="none"/></defs>
              <text fontSize="7" fontWeight="700" fill={th.text+"66"}><textPath href={`#${pid}`} startOffset="50%" textAnchor="middle">{cat.name}</textPath></text></g>)})()}

          {/* Data ring background */}
          {MF.map((_,mi)=>{
            const sd=mD(mi),ed=mD(mi)+30*dir,s2=Math.min(sd,ed),e2=Math.max(sd,ed);
            const isSel=mi===selectedMonth,isCur=mi===cm;
            return<path key={`bg${mi}`} d={aP(cx,cy,dataRO,dataRI,s2,e2)} fill={cat.color} opacity={isSel?.65:isCur?.5:.3} stroke={th.card} strokeWidth=".5" onClick={()=>onMonthClick(mi)} style={{cursor:"pointer"}}/>;
          })}
        </g>
      ))}

      {/* Month divider lines through all rings */}
      {Array.from({length:12},(_,i)=>{const d=mD(i),[x1,y1]=p2c(cx,cy,monthRI,d),[x2,y2]=p2c(cx,cy,outerR,d);
        return<line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={th.card+"88"} strokeWidth="1"/>})}

      {/* Holiday markers */}
      {s.showHolidays&&holidays.map((h,hi)=>{
        const mi=h.month,dayFrac=h.day/DAYS_IN_MONTH[mi];
        const deg=mD(mi)+dayFrac*30*dir;
        const[hx,hy]=p2c(cx,cy,monthRO+1,deg);
        return<circle key={hi} cx={hx} cy={hy} r={2.5} fill="#E8453C" opacity=".7"><title>{h.name}</title></circle>;
      })}

      {/* Event boxes */}
      {rings.map(({cat,ri,dataRI,dataRO})=>{
        return Object.entries(eRM).filter(([k])=>k.startsWith(ri+"-")).map(([key,evs])=>{
          const mi=+key.split("-")[1];
          const sd=mD(mi)+.5*dir,ed=mD(mi)+30*dir-.5*dir,s2=Math.min(sd,ed),e2=Math.max(sd,ed);
          const n=evs.length,sl=(e2-s2)/n;
          const rI=dataRI+1,rO=dataRO-1,rM=(rI+rO)/2;
          return evs.map((ev,ei)=>{
            const es=s2+ei*sl+.3,ee=s2+(ei+1)*sl-.3,mid=(es+ee)/2;
            const bp=aP(cx,cy,rO,rI,es,ee),isH=hov===ev.id;
            const[tx,ty]=p2c(cx,cy,rM,mid),tr=mid,fl=tr>90&&tr<270,fr=fl?tr+180:tr;
            const al=(Math.PI*2*rM*(ee-es))/360,mc=Math.max(2,Math.floor(al/6));
            let dt=ev.title;if(dt.length>mc)dt=dt.slice(0,mc-1)+"\u2026";
            const fc=ev.eventColor||th.card,tc=ev.eventColor?"#fff":th.text;
            return(<g key={ev.id} onMouseEnter={()=>setHov(ev.id)} onMouseLeave={()=>{setHov(null);setTip(null)}}
              onMouseMove={e=>hMM(e,ev)} onClick={e=>{e.stopPropagation();onEventClick(ev)}} style={{cursor:"pointer"}}>
              <path d={bp} fill={fc} opacity={isH?1:ev.eventColor?.9:.88} stroke={isH?th.text:th.card+"55"} strokeWidth={isH?1.5:.5} filter={isH?"url(#bs)":undefined}/>
              <text x={tx} y={ty} textAnchor="middle" dominantBaseline="central" fill={tc} fontSize={rO-rI>35?"9":"7.5"} fontWeight="700" transform={`rotate(${fr},${tx},${ty})`} style={{pointerEvents:"none"}}>{dt}</text>
              {/* Tag dots */}
              {ev.tags&&ev.tags.length>0&&(()=>{const[dx,dy]=p2c(cx,cy,rO-3,es+1);const tag=TAGS.find(t=>t.id===ev.tags[0]);
                return tag?<circle cx={dx} cy={dy} r={2} fill={tag.color} opacity=".9"/>:null;
              })()}
            </g>);
          });
        });
      })}

      {/* Center */}
      <circle cx={cx} cy={cy} r={centerR+8} fill={th.cardAlt} stroke={th.border} strokeWidth="1"/>
      <circle cx={cx} cy={cy} r={centerR} fill={th.card} stroke={th.border} strokeWidth="1"/>
      {s.logo?<image href={s.logo} x={cx-centerR+8} y={cy-centerR+8} width={(centerR-8)*2} height={(centerR-8)*2} clipPath={`circle(${centerR-10}px at ${centerR-8}px ${centerR-8}px)`} style={{borderRadius:"50%"}}/>:
      <><text x={cx} y={cy-12} textAnchor="middle" fill={th.text} fontSize="11" fontWeight="800" style={{letterSpacing:".06em"}}>{clockTitle||"VUOSIKELLO"}</text>
        <text x={cx} y={cy+8} textAnchor="middle" fill="#5B5EA6" fontSize="20" fontWeight="800">{new Date().getFullYear()}</text>
        <text x={cx} y={cy+22} textAnchor="middle" fill={th.sub} fontSize="8">{events.length} tapahtumaa</text></>}
    </svg>

    {tip&&<div style={{position:"absolute",left:Math.min(tip.x+12,sz-230),top:tip.y-10,background:"#1a1a2e",color:"#f8fafc",padding:"10px 14px",borderRadius:10,fontSize:12,maxWidth:240,zIndex:50,boxShadow:"0 8px 24px rgba(0,0,0,.3)",pointerEvents:"none",border:`2px solid ${tip.ev.eventColor||cM[tip.ev.categoryId]?.color||"#5B5EA6"}`}}>
      <div style={{fontWeight:700,marginBottom:3}}>{tip.ev.title}</div>
      {tip.ev.desc&&<div style={{fontSize:11,color:"#94a3b8",lineHeight:1.4}}>{tip.ev.desc}</div>}
      {tip.ev.tags&&tip.ev.tags.length>0&&<div style={{display:"flex",gap:3,marginTop:4,flexWrap:"wrap"}}>{tip.ev.tags.map(t=>{const tag=TAGS.find(x=>x.id===t);return tag?<span key={t} style={{fontSize:8,padding:"1px 6px",borderRadius:99,background:tag.color+"33",color:tag.color,fontWeight:600}}>{tag.name}</span>:null})}</div>}
      <div style={{fontSize:9,color:"#64748b",marginTop:4}}>{MF[tip.ev.month]} · {cM[tip.ev.categoryId]?.name||""}</div>
    </div>}
  </div>);
}

}

/* ═══ Event Modal with Tags ═══ */
function EventModal({event,month,categories,onSave,onCancel,theme:th}){
  const[t,setT]=useState(event?.title||"");const[d,setD]=useState(event?.desc||"");
  const[ci,setCi]=useState(event?.categoryId||categories[0]?.id||"");
  const[sm,setSm]=useState(event?.month??month??0);const[ec,setEc]=useState(event?.eventColor||null);
  const[tags,setTags]=useState(event?.tags||[]);
  const toggleTag=id=>setTags(tags.includes(id)?tags.filter(x=>x!==id):[...tags,id]);
  const go=()=>{if(!t.trim())return;onSave({id:event?.id||uid(),month:sm,title:t.trim(),desc:d.trim(),categoryId:ci,eventColor:ec,tags})};
  return(<div style={makeOvr(th)} onClick={onCancel}><div onClick={e=>e.stopPropagation()} style={makeMod(th)}>
    <h3 style={{margin:"0 0 14px",fontSize:16,fontWeight:800}}>{event?"Muokkaa":"Uusi tapahtuma"}</h3>

function App(){

    const st=ld();if(st)return{clocks:st.map(c=>({...c,events:(c.events||[]).map(e=>({...e,tags:e.tags||[]})),categories:(c.categories||[]).map(ct=>({...ct,visible:ct.visible!==false})),settings:{...DS,...(c.settings||{})}})),fromShare:false};return null;

  useEffect(()=>{if(init?.fromShare){setToast("Jaettu vuosikello avattu!");setTimeout(()=>setToast(null),3000);window.history.replaceState({},"",window.location.pathname)}},[]);
  useEffect(()=>{if(clocks.length>0)sv(clocks)},[clocks]);

  const clock=clocks.find(c=>c.id===acId)||clocks[0];
  const th=useTh(clock?.settings?.theme||"light");
  const visCIds=clock?clock.categories.filter(c=>c.visible).map(c=>c.id):[];
  const fEv=clock?clock.events.filter(e=>visCIds.includes(e.categoryId)):[];
  const holidays=clock?.settings?.showHolidays?FI_HOLIDAYS:[];

  const saveEv=ev=>{const ex=clock.events.find(e=>e.id===ev.id);if(ex)upd({events:clock.events.map(e=>e.id===ev.id?ev:e)});else upd({events:[...clock.events,ev]});setEditEv(null)};
  const delEv=id=>upd({events:clock.events.filter(e=>e.id!==id)});

  const saveName=()=>{if(nameVal.trim()){upd({name:nameVal.trim()});setEditName(false)}};

        <div style={{display:"flex",justifyContent:"flex-end",marginBottom:8,gap:4}}>
          <button onClick={()=>setShowCat(true)} style={{fontSize:9,padding:"3px 9px",borderRadius:5,border:`1px solid ${th.border}`,background:th.card,color:th.muted,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>🏷 Kehät</button>
          <button onClick={()=>setShowSett(true)} style={{fontSize:9,padding:"3px 9px",borderRadius:5,border:`1px solid ${th.border}`,background:th.card,color:th.muted,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>⚙️</button>
          <button onClick={()=>setEditEv({month:selM??new Date().getMonth()})} style={{fontSize:9,padding:"3px 12px",borderRadius:5,border:"none",background:"#5B5EA6",color:"#fff",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>+ Tapahtuma</button>
        </div>

        {view==="clock"&&<CircularClock events={fEv} categories={clock.categories.filter(c=>c.visible)} onMonthClick={m=>setSelM(selM===m?null:m)} onEventClick={ev=>setEditEv(ev)} clockTitle={clock.name} selectedMonth={selM} settings={clock.settings} theme={th} holidays={holidays}/>}
        {view==="roadmap"&&<RoadmapView events={fEv} categories={clock.categories.filter(c=>c.visible)} onEventClick={ev=>setEditEv(ev)} clockTitle={clock.name} theme={th}/>}
        {view==="timeline"&&<TimelineView events={fEv} categories={clock.categories.filter(c=>c.visible)} onEventClick={ev=>setEditEv(ev)} clockTitle={clock.name} theme={th}/>}
        {view==="list"&&<ListView events={fEv} categories={clock.categories} onMonthClick={m=>setSelM(selM===m?null:m)} onEventClick={ev=>setEditEv(ev)} theme={th}/>}

        {selM!==null&&view!=="timeline"&&view!=="roadmap"&&<MonthPanel month={selM} events={fEv} categories={clock.categories} onAdd={m=>setEditEv({month:m})} onEdit={ev=>setEditEv(ev)} onDelete={delEv} onClose={()=>setSelM(null)} theme={th}/>}
      </div>
    </div>

    {editEv&&<EventModal event={editEv.id?editEv:null} month={editEv.month} categories={clock.categories} onSave={saveEv} onCancel={()=>setEditEv(null)} theme={th}/>}
    {showCat&&<CatModal categories={clock.categories} onSave={cats=>{upd({categories:cats.map(c=>({...c,visible:c.visible!==false}))});setShowCat(false)}} onCancel={()=>setShowCat(false)} theme={th}/>}
    {showSett&&<SettModal settings={clock.settings||DS} onSave={s=>{upd({settings:s});setShowSett(false)}} onCancel={()=>setShowSett(false)} theme={th}/>}
    {showShare&&<ShareModal clock={clock} onClose={()=>setShowShare(false)} theme={th}/>}
    {toast&&<div className="toast">{toast}</div>}
  </div>);
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
