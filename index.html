/* ═══ Month degree calculator - handles both normal and precise mode ═══ */
function useMonthGeometry(settings){
  const s=settings||DS;
  const cm=new Date().getMonth();
  const rOff=s.revolving?-(cm*30+15):-(s.startMonth*30);
  const dir=s.clockwise?1:-1;

  // Cumulative day offsets for precise mode
  const cumDays=useMemo(()=>{const a=[0];for(let i=0;i<12;i++)a.push(a[i]+DIM[i]);return a},[]);

  // Month start degree
  const monthStart=useCallback((mi)=>{
    if(s.preciseMode){
      const dayDeg=cumDays[mi]/TOTAL_DAYS*360;
      return dayDeg*dir+rOff;
    }
    return mi*30*dir+rOff;
  },[s.preciseMode,s.clockwise,s.revolving,rOff,dir,cumDays]);

  // Month end degree
  const monthEnd=useCallback((mi)=>{
    if(s.preciseMode){
      const dayDeg=cumDays[mi+1]/TOTAL_DAYS*360;
      return dayDeg*dir+rOff;
    }
    return (mi+1)*30*dir+rOff;
  },[s.preciseMode,s.clockwise,s.revolving,rOff,dir,cumDays]);

  // Month span in degrees
  const monthSpan=useCallback((mi)=>{
    if(s.preciseMode)return DIM[mi]/TOTAL_DAYS*360;
    return 30;
  },[s.preciseMode]);

  // Day position within a month (for precise event placement)
  const dayDeg=useCallback((mi,day)=>{
    const ms=monthStart(mi);
    const span=monthSpan(mi);
    const frac=(day-1)/DIM[mi];
    return ms+frac*span*dir;
  },[monthStart,monthSpan,dir]);

  // Week lines within a month
  const weekDegs=useCallback((mi)=>{
    const weeks=[];
    const span=monthSpan(mi);
    const ms=monthStart(mi);
    for(let d=8;d<=DIM[mi];d+=7){
      const frac=(d-1)/DIM[mi];
      weeks.push({deg:ms+frac*span*dir,label:`${d}`});
    }
    return weeks;
  },[monthStart,monthSpan,dir]);

  return{monthStart,monthEnd,monthSpan,dayDeg,weekDegs,dir,cm};
}

/* ═══ Mini Clock ═══ */
function MiniClock({categories,events,size:sz}){
  const s=sz||100,cx=s/2,cy=s/2,iR=s*.15,rS=s*.22,rG=1;
  const rW=(s/2-rS-3)/Math.max(categories.length,1)-rG;
  return(<svg viewBox={`0 0 ${s} ${s}`} width={sz} height={sz}>
    {categories.map((cat,ri)=>{const rO=rS+(ri+1)*(rW+rG)-rG,rI=rS+ri*(rW+rG);
      return(<g key={ri}>{Array.from({length:12},(_,mi)=>{const has=events.some(e=>e.month===mi&&e.categoryId===cat.id);
        return<path key={mi} d={aP(cx,cy,rO,rI,mi*30,(mi+1)*30)} fill={cat.color} opacity={has?.7:.25} stroke="#fff" strokeWidth=".5"/>})}</g>)})}
    <circle cx={cx} cy={cy} r={rS} fill="#f8fafc" stroke="#e2e8f0" strokeWidth=".5"/>
    <circle cx={cx} cy={cy} r={iR} fill="#fff"/>
    {events.slice(0,15).map((ev,i)=>{const cat=categories.find(c=>c.id===ev.categoryId);if(!cat)return null;
      const ri=categories.indexOf(cat),rI2=rS+ri*(rW+rG)+1,rO2=rS+(ri+1)*(rW+rG)-rG-1,rM=(rI2+rO2)/2;
      const[x,y]=p2c(cx,cy,rM,ev.month*30+15);
      return<circle key={i} cx={x} cy={y} r={Math.max(1.2,rW/4)} fill={ev.eventColor||"#fff"} opacity=".9"/>;
    })}
  </svg>);
}

/* ═══ Circular Clock ═══ */
function CircularClock({events,categories,onMonthClick,onEventClick,clockTitle,selectedMonth,settings,theme:th,holidays,showDayRing}){
  const[hov,setHov]=useState(null);const[tip,setTip]=useState(null);const ref=useRef(null);
  const vc=categories.filter(c=>c.visible);
  const s={...DS,...(settings||{})};
  const cm=new Date().getMonth();
  const rOff=s.revolving?-(cm*30+15):-(s.startMonth*30);
  const dir=s.clockwise?1:-1;
  const mS=mi=>mi*30*dir+rOff;
  const mE=mi=>(mi+1)*30*dir+rOff;

  const sz=840,cx=sz/2,cy=sz/2;
  const centerR=s.logo?52:48,monthRW=22,catLW=10;
  const dayRingW=showDayRing?40:0;
  const dataRW=Math.min(50,(sz/2-centerR-monthRW-14-dayRingW)/Math.max(vc.length,1)-(catLW+3));
  const monthRI=centerR+6,monthRO=monthRI+monthRW;
  let nR=monthRO+2;
  const rings=vc.map((cat,ri)=>{const lRI=nR,lRO=lRI+catLW,dRI=lRO+1,dRO=dRI+dataRW;nR=dRO+2;return{cat,ri,lRI,lRO,dRI,dRO}});
  const holRingW=s.showHolidays&&holidays.length?14:0;
  const dayRI=nR+holRingW+2,dayRO=dayRI+dayRingW;
  const holRI=nR+1,holRO=holRI+holRingW;
  const outerR=showDayRing?dayRO:holRingW?holRO:nR;

  const cM=useMemo(()=>{const m={};vc.forEach((c,i)=>m[c.id]={...c,ri:i});return m},[vc]);
  const hMM=(e,ev)=>{if(!ref.current)return;const r=ref.current.getBoundingClientRect();setTip({x:e.clientX-r.left,y:e.clientY-r.top,ev})};
  const eRM=useMemo(()=>{const m={};events.forEach(ev=>{const c=cM[ev.categoryId];if(!c)return;const k=`${c.ri}-${ev.month}`;if(!m[k])m[k]=[];m[k].push(ev)});return m},[events,cM]);

  // Build day ring data: 365 slices with weekday + date labels
  const daySlices=useMemo(()=>{
    if(!showDayRing)return[];
    const yr=new Date().getFullYear();
    const slices=[];
    let totalDays=0;
    for(let mi=0;mi<12;mi++)totalDays+=DIM[mi];
    let dayIdx=0;
    for(let mi=0;mi<12;mi++){
      for(let d=1;d<=DIM[mi];d++){
        const degPerDay=360/totalDays;
        const startDeg=dayIdx*degPerDay;
        const endDeg=(dayIdx+1)*degPerDay;
        // Apply rotation and direction
        const s1=startDeg*dir+rOff;
        const e1=endDeg*dir+rOff;
        const dt=new Date(yr,mi,d);
        const wk=WKDAYS[dt.getDay()];
        const isToday=mi===new Date().getMonth()&&d===new Date().getDate();
        const isWeekend=dt.getDay()===0||dt.getDay()===6;
        slices.push({mi,d,s:Math.min(s1,e1),e:Math.max(s1,e1),wk,isToday,isWeekend,label:`${wk} ${d}.${mi+1}.`});
        dayIdx++;
      }
    }
    return slices;
  },[showDayRing,rOff,dir]);

  return(<div style={{position:"relative",width:"100%",maxWidth:sz,margin:"0 auto"}}>
    <svg ref={ref} viewBox={`0 0 ${sz} ${sz}`} style={{width:"100%",height:"auto",fontFamily:"'DM Sans',sans-serif"}} onMouseLeave={()=>setTip(null)}>
      <defs><filter id="bs"><feDropShadow dx="0" dy="1" stdDeviation="1.5" floodOpacity=".2"/></filter></defs>

      {/* Day ring - outermost */}
      {showDayRing&&daySlices.map((ds,i)=>{
        const mid=(ds.s+ds.e)/2;
        const rText=(dayRI+dayRO)/2;
        const[tx,ty]=p2c(cx,cy,rText,mid);
        const rot=mid,fl=rot>90&&rot<270;
        const isMonday=new Date(new Date().getFullYear(),ds.mi,ds.d).getDay()===1;
        const is1st=ds.d===1;
        return(<g key={i}>
          <path d={aP(cx,cy,dayRO,dayRI,ds.s,ds.e)}
            fill={ds.isToday?"#5B5EA633":ds.isWeekend?th.border+"55":is1st?"#5B5EA611":th.alt}
            stroke={isMonday||is1st?th.muted+"66":th.border+"44"} strokeWidth={isMonday||is1st?".8":".2"}/>
          <text x={tx} y={ty} textAnchor="middle" dominantBaseline="central"
            fill={ds.isToday?"#E8453C":isMonday?"#5B5EA6":ds.isWeekend?th.sub:th.muted}
            fontSize={ds.isToday?"7":isMonday?"6":"5"} fontWeight={ds.isToday||isMonday?"800":"500"}
            transform={`rotate(${fl?rot+180:rot},${tx},${ty})`}>
            {ds.isToday?`${ds.wk} ${ds.d}.${ds.mi+1}.`:isMonday?`${ds.wk} ${ds.d}.`:ds.d}
          </text>
        </g>);
      })}

      {/* Month ring */}
      {MF.map((nm,mi)=>{
        const sd=mS(mi),ed=mE(mi),s2=Math.min(sd,ed),e2=Math.max(sd,ed);
        const isCur=mi===cm,isSel=mi===selectedMonth;
        return(<g key={`mr${mi}`}>
          <path d={aP(cx,cy,monthRO,monthRI,s2,e2)}
            fill={isSel?th.text+"22":isCur?"#5B5EA622":th.alt}
            stroke={th.border} strokeWidth=".5" onClick={()=>onMonthClick(mi)} style={{cursor:"pointer"}}/>
          {(()=>{const md=(s2+e2)/2,[lx,ly]=p2c(cx,cy,(monthRI+monthRO)/2,md),rot=md,fl=rot>90&&rot<270;
            return<text x={lx} y={ly} textAnchor="middle" dominantBaseline="central"
              fill={isCur?"#5B5EA6":th.muted} fontSize="9" fontWeight={isCur?"800":"600"}
              transform={`rotate(${fl?rot+180:rot},${lx},${ly})`}
              onClick={()=>onMonthClick(mi)} style={{cursor:"pointer"}}>{MS[mi]}</text>})()}
        </g>);
      })}

      {/* Category label + data rings */}
      {rings.map(({cat,ri,lRI,lRO,dRI,dRO})=>(
        <g key={cat.id}>
          {MF.map((_,mi)=>{const sd=mS(mi),ed=mE(mi),s2=Math.min(sd,ed),e2=Math.max(sd,ed);
            return<path key={`l${mi}`} d={aP(cx,cy,lRO,lRI,s2,e2)} fill={cat.color} opacity=".55" stroke={th.card} strokeWidth=".3"/>})}
          {MF.map((_,mi)=>{const sd=mS(mi),ed=mE(mi),s2=Math.min(sd,ed),e2=Math.max(sd,ed);
            const isSel=mi===selectedMonth,isCur=mi===cm;
            return<path key={`d${mi}`} d={aP(cx,cy,dRO,dRI,s2,e2)} fill={cat.color} opacity={isSel?.65:isCur?.5:.3} stroke={th.card} strokeWidth=".5" onClick={()=>onMonthClick(mi)} style={{cursor:"pointer"}}/>})}
          {/* Category name labels - appear at 3 positions around the ring */}
          {[{pos:0,label:"top"},{pos:4,label:"left"},{pos:8,label:"bottom"}].map(({pos})=>{
            const la=mS(pos),lb=mE(pos+1),s2=Math.min(la,lb),e2=Math.max(la,lb);
            const rM=(lRI+lRO)/2;
            const pid=`cl${ri}_${pos}`;
            const[sx2,sy2]=p2c(cx,cy,rM,s2),[ex2,ey2]=p2c(cx,cy,rM,e2);
            return(<g key={`${cat.id}_l${pos}`}>
              <defs><path id={pid} d={`M${sx2},${sy2} A${rM},${rM} 0 0,1 ${ex2},${ey2}`} fill="none"/></defs>
              <text fontSize="8" fontWeight="800" fill={th.text} opacity=".45" style={{letterSpacing:".08em"}}>
                <textPath href={`#${pid}`} startOffset="50%" textAnchor="middle">{cat.name.toUpperCase()}</textPath>
              </text>
            </g>);
          })}
        </g>))}

      {/* Divider lines */}
      {Array.from({length:12},(_,i)=>{const d=mS(i),[x1,y1]=p2c(cx,cy,monthRI,d),[x2,y2]=p2c(cx,cy,outerR,d);
        return<line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={th.card+"88"} strokeWidth="1"/>})}

      {/* Holiday ring */}
      {s.showHolidays&&holidays.length>0&&(<g>
        {/* Ring background per month */}
        {MF.map((_,mi)=>{const sd=mS(mi),ed=mE(mi),s2=Math.min(sd,ed),e2=Math.max(sd,ed);
          return<path key={`hbg${mi}`} d={aP(cx,cy,holRO,holRI,s2,e2)} fill="#E8453C08" stroke={th.border} strokeWidth=".3"/>})}
        {/* Holiday boxes */}
        {holidays.map((h,hi)=>{
          const sd=mS(h.month),ed=mE(h.month),s2=Math.min(sd,ed),e2=Math.max(sd,ed);
          const span=e2-s2;
          const dayFrac=h.day/DIM[h.month];
          const center=s2+dayFrac*span;
          const halfW=span*3/DIM[h.month]/2;
          const hs=center-halfW,he=center+halfW;
          const mid=(hs+he)/2;
          const[tx,ty]=p2c(cx,cy,(holRI+holRO)/2,mid);
          const rot=mid,fl=rot>90&&rot<270;
          const arcLen=(Math.PI*2*((holRI+holRO)/2)*Math.abs(he-hs))/360;
          const maxC=Math.max(2,Math.floor(arcLen/4.5));
          let nm=h.name;if(nm.length>maxC)nm=nm.slice(0,maxC-1)+"\u2026";
          return(<g key={hi} style={{cursor:"pointer"}}
            onMouseMove={e=>{if(!ref.current)return;const r=ref.current.getBoundingClientRect();setTip({x:e.clientX-r.left,y:e.clientY-r.top,ev:{title:h.name,desc:`${h.day}.${h.month+1}. — Juhlapyhä`,month:h.month,tags:[],eventColor:"#E8453C",categoryId:null}})}}
            onMouseLeave={()=>setTip(null)}>
            <path d={aP(cx,cy,holRO,holRI,Math.min(hs,he),Math.max(hs,he))}
              fill="#E8453C" opacity=".75" stroke="#fff" strokeWidth=".5"/>
            <text x={tx} y={ty} textAnchor="middle" dominantBaseline="central"
              fill="#fff" fontSize="5" fontWeight="700"
              transform={`rotate(${fl?rot+180:rot},${tx},${ty})`}
              style={{pointerEvents:"none"}}>{nm}</text>
          </g>);
        })}
      </g>)}

      {/* Today marker line */}
      {(()=>{const td=new Date(),mi=td.getMonth(),day=td.getDate();
        const sd=mS(mi),ed=mE(mi),s2=Math.min(sd,ed),e2=Math.max(sd,ed);
        const deg=s2+(day/DIM[mi])*(e2-s2);
        const[x1,y1]=p2c(cx,cy,monthRI-2,deg),[x2,y2]=p2c(cx,cy,outerR+3,deg);
        return<line x1={x1} y1={y1} x2={x2} y2={y2} stroke="#E8453C" strokeWidth="1.5" opacity=".5" strokeDasharray="4 3"/>;
      })()}

      {/* Event boxes */}
      {rings.map(({cat,ri,dRI,dRO})=>{
        return Object.entries(eRM).filter(([k])=>k.startsWith(ri+"-")).map(([key,evs])=>{
          const mi=+key.split("-")[1];
          const rI=dRI+1,rO=dRO-1,rM=(rI+rO)/2;
          const sd=mS(mi)+.5*dir,ed=mE(mi)-.5*dir,s2n=Math.min(sd,ed),e2n=Math.max(sd,ed);
          const n=evs.length,sl=(e2n-s2n)/n;
          return evs.map((ev,ei)=>{
            const es=s2n+ei*sl+.3,ee=s2n+(ei+1)*sl-.3,mid=(es+ee)/2;
            const bp=aP(cx,cy,rO,rI,es,ee),isH=hov===ev.id;
            const[tx,ty]=p2c(cx,cy,rM,mid),tr=mid,fl=tr>90&&tr<270,fr=fl?tr+180:tr;
            const al=(Math.PI*2*rM*(ee-es))/360,mc=Math.max(2,Math.floor(al/6));
            let dt=ev.title;if(dt.length>mc)dt=dt.slice(0,mc-1)+"\u2026";
            const fc=ev.eventColor||th.card,tc=ev.eventColor?"#fff":th.text;
            return(<g key={ev.id} onMouseEnter={()=>setHov(ev.id)} onMouseLeave={()=>{setHov(null);setTip(null)}} onMouseMove={e=>hMM(e,ev)} onClick={e=>{e.stopPropagation();onEventClick(ev)}} style={{cursor:"pointer"}}>
              <path d={bp} fill={fc} opacity={isH?1:ev.eventColor?.9:.88} stroke={isH?th.text:th.card+"55"} strokeWidth={isH?1.5:.5} filter={isH?"url(#bs)":undefined}/>
              <text x={tx} y={ty} textAnchor="middle" dominantBaseline="central" fill={tc} fontSize={rO-rI>35?"9":"7.5"} fontWeight="700" transform={`rotate(${fr},${tx},${ty})`} style={{pointerEvents:"none"}}>{dt}</text>
              {ev.tags&&ev.tags.length>0&&(()=>{const tag=TAGS.find(t=>t.id===ev.tags[0]);return tag?<circle cx={p2c(cx,cy,rO-2,es+.5)[0]} cy={p2c(cx,cy,rO-2,es+.5)[1]} r={1.8} fill={tag.color} opacity=".9"/>:null})()}
            </g>);
          });
        });
      })}

      {/* Center */}
      <circle cx={cx} cy={cy} r={centerR+6} fill={th.alt} stroke={th.border} strokeWidth="1"/>
      <circle cx={cx} cy={cy} r={centerR} fill={th.card} stroke={th.border} strokeWidth="1"/>
      {s.logo?<image href={s.logo} x={cx-centerR+6} y={cy-centerR+6} width={(centerR-6)*2} height={(centerR-6)*2}/>:
      <><text x={cx} y={cy-10} textAnchor="middle" fill={th.text} fontSize="10" fontWeight="800" style={{letterSpacing:".05em"}}>{clockTitle||"VUOSIKELLO"}</text>
        <text x={cx} y={cy+8} textAnchor="middle" fill="#5B5EA6" fontSize="18" fontWeight="800">{new Date().getFullYear()}</text>
        <text x={cx} y={cy+20} textAnchor="middle" fill={th.sub} fontSize="7">{events.length} tapahtumaa</text></>}
    </svg>

    {tip&&<div style={{position:"absolute",left:Math.min(tip.x+12,sz-240),top:tip.y-10,background:"#1a1a2e",color:"#f8fafc",padding:"10px 14px",borderRadius:10,fontSize:12,maxWidth:240,zIndex:50,boxShadow:"0 8px 24px rgba(0,0,0,.3)",pointerEvents:"none",border:`2px solid ${tip.ev.eventColor||cM[tip.ev.categoryId]?.color||"#5B5EA6"}`}}>
      <div style={{fontWeight:700,marginBottom:3}}>{tip.ev.title}</div>
      {tip.ev.desc&&<div style={{fontSize:11,color:"#94a3b8",lineHeight:1.4}}>{tip.ev.desc}</div>}
      {tip.ev.startDay&&<div style={{fontSize:9,color:"#5B5EA6",marginTop:2}}>{tip.ev.startDay}.–{tip.ev.endDay||DIM[tip.ev.month]}.{tip.ev.month+1}.</div>}
      {tip.ev.tags&&tip.ev.tags.length>0&&<div style={{display:"flex",gap:3,marginTop:3,flexWrap:"wrap"}}>{tip.ev.tags.map(t=>{const tag=TAGS.find(x=>x.id===t);return tag?<span key={t} style={{fontSize:7,padding:"1px 5px",borderRadius:99,background:tag.color+"33",color:tag.color,fontWeight:600}}>{tag.name}</span>:null})}</div>}
      <div style={{fontSize:9,color:"#64748b",marginTop:3}}>{MF[tip.ev.month]} · {cM[tip.ev.categoryId]?.name||""}</div>
    </div>}
  </div>);
}

/* ═══ Event Modal ═══ */
function EventModal({event,month,categories,onSave,onCancel,theme:th}){
  const[t,setT]=useState(event?.title||"");const[d,setD]=useState(event?.desc||"");const[ci,setCi]=useState(event?.categoryId||categories[0]?.id||"");
  const[sm,setSm]=useState(event?.month??month??0);const[ec,setEc]=useState(event?.eventColor||null);
  const[tags,setTags]=useState(event?.tags||[]);const[sd,setSd]=useState(event?.startDay||"");const[ed,setEd]=useState(event?.endDay||"");
  const[recur,setRecur]=useState("once"); // once | monthly | quarterly | halfyearly
  const toggleTag=id=>setTags(tags.includes(id)?tags.filter(x=>x!==id):[...tags,id]);
  const go=()=>{
    if(!t.trim())return;
    const base={title:t.trim(),desc:d.trim(),categoryId:ci,eventColor:ec,tags,startDay:sd?+sd:null,endDay:ed?+ed:null};
    if(event){
      // Editing existing - just save normally
      onSave({...base,id:event.id,month:sm});
    } else {
      // New event - handle recurrence
      const evts=[];
      if(recur==="once"){
        evts.push({...base,id:uid(),month:sm});
      } else if(recur==="monthly"){
        for(let m=sm;m<12;m++) evts.push({...base,id:uid(),month:m});
      } else if(recur==="quarterly"){
        for(let m=sm;m<12;m+=3) evts.push({...base,id:uid(),month:m});
      } else if(recur==="halfyearly"){
        evts.push({...base,id:uid(),month:sm});
        if(sm+6<12) evts.push({...base,id:uid(),month:sm+6});
      }
      // Save all at once
      onSave(evts);
    }
  };
  const ovr={position:"fixed",inset:0,background:"rgba(0,0,0,.4)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16,backdropFilter:"blur(4px)"};
  const mod={background:th.card,borderRadius:14,padding:20,width:"100%",maxWidth:460,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 24px 48px rgba(0,0,0,.2)",color:th.text,border:`1px solid ${th.border}`};
  const lb2={display:"block",color:th.muted,fontSize:12,fontWeight:700,marginBottom:4};
  const in2={width:"100%",padding:"7px 10px",borderRadius:7,border:`1.5px solid ${th.border}`,background:th.alt,color:th.text,fontSize:12,marginBottom:10,fontFamily:"inherit",outline:"none"};
  return(<div style={ovr} onClick={onCancel}><div onClick={e=>e.stopPropagation()} style={mod}>
    <h3 style={{margin:"0 0 12px",fontSize:18,fontWeight:800}}>{event?"Muokkaa":"Uusi tapahtuma"}</h3>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
      <div><label style={lb2}>Kuukausi</label><select value={sm} onChange={e=>setSm(+e.target.value)} style={in2}>{MF.map((m,i)=><option key={i} value={i}>{m}</option>)}</select></div>
      <div><label style={lb2}>Kehä</label><select value={ci} onChange={e=>setCi(e.target.value)} style={in2}>{categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
    </div>
    <label style={lb2}>Otsikko *</label><input value={t} onChange={e=>setT(e.target.value)} placeholder="Nimi" style={in2} autoFocus/>
    <label style={lb2}>Kuvaus</label><textarea value={d} onChange={e=>setD(e.target.value)} placeholder="Lisätietoja..." rows={2} style={{...in2,resize:"vertical",minHeight:40}}/>

    {/* Day range - shown prominently if precise mode */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
      <div><label style={lb2}>Alkupäivä</label><input type="number" min="1" max="31" value={sd} onChange={e=>setSd(e.target.value)} placeholder="–" style={in2}/></div>
      <div><label style={lb2}>Loppupäivä</label><input type="number" min="1" max="31" value={ed} onChange={e=>setEd(e.target.value)} placeholder="–" style={in2}/></div>
    </div>

    {/* Recurrence - only for new events */}
    {!event&&<><label style={lb2}>Toistuvuus</label>
    <div style={{display:"flex",flexWrap:"wrap",gap:3,marginBottom:10}}>
      {[{v:"once",l:"Kerran",icon:"1️⃣"},{v:"monthly",l:"Kuukausittain",icon:"🔄"},{v:"quarterly",l:"Kvartaaleittain",icon:"📊"},{v:"halfyearly",l:"Puolivuosittain",icon:"↕️"}].map(o=>
        <button key={o.v} onClick={()=>setRecur(o.v)} style={{padding:"4px 10px",borderRadius:99,border:`1.5px solid ${recur===o.v?"#5B5EA6":th.border}`,background:recur===o.v?"#5B5EA622":th.card,color:recur===o.v?"#5B5EA6":th.muted,fontSize:9,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{o.icon} {o.l}</button>
      )}
    </div>
    {recur!=="once"&&<div style={{fontSize:9,color:"#5B5EA6",marginBottom:10,padding:"6px 10px",borderRadius:6,background:"#5B5EA608",border:"1px solid #5B5EA622"}}>
      {recur==="monthly"&&`Luodaan ${12-sm} tapahtumaa: ${MF.slice(sm).map(m=>m.slice(0,3)).join(", ")}`}
      {recur==="quarterly"&&`Luodaan ${Math.ceil((12-sm)/3)} tapahtumaa: ${Array.from({length:Math.ceil((12-sm)/3)},(_,i)=>MF[sm+i*3]?.slice(0,3)).filter(Boolean).join(", ")}`}
      {recur==="halfyearly"&&`Luodaan ${sm+6<12?2:1} tapahtumaa: ${MF[sm].slice(0,3)}${sm+6<12?", "+MF[sm+6].slice(0,3):""}`}
    </div>}
    </>}

    <label style={lb2}>Väri</label>
    <div style={{display:"flex",flexWrap:"wrap",gap:3,marginBottom:8}}>
      <button onClick={()=>setEc(null)} style={{padding:"2px 7px",borderRadius:99,border:`1.5px solid ${!ec?th.text:th.border}`,background:th.card,fontSize:8,fontWeight:600,cursor:"pointer",fontFamily:"inherit",color:th.muted}}>Oletus</button>
      {TAGS.map(c=><button key={c.id} onClick={()=>setEc(c.color)} style={{padding:"2px 7px",borderRadius:99,border:`1.5px solid ${ec===c.color?c.color:"transparent"}`,background:c.color+(ec===c.color?"33":"12"),color:c.color,fontSize:8,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{c.name}</button>)}</div>
    <label style={lb2}>Tunnisteet</label>
    <div style={{display:"flex",flexWrap:"wrap",gap:3,marginBottom:12}}>
      {TAGS.map(tag=><button key={tag.id} onClick={()=>toggleTag(tag.id)} style={{padding:"2px 7px",borderRadius:99,border:`1.5px solid ${tags.includes(tag.id)?tag.color:"transparent"}`,background:tag.color+(tags.includes(tag.id)?"33":"08"),color:tag.color,fontSize:8,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{tag.icon}{tag.name}</button>)}</div>
    <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}><button onClick={onCancel} style={{padding:"8px 14px",borderRadius:8,border:`1px solid ${th.border}`,background:th.card,color:th.muted,fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Peruuta</button><button onClick={go} style={{padding:"8px 16px",borderRadius:8,border:"none",background:"#5B5EA6",color:"#fff",fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:"inherit",opacity:t.trim()?1:.4}}>{event?"Tallenna":"Lisää"}</button></div>
  </div></div>);
}

function MonthPanel({month,events,categories,holidays,onAdd,onEdit,onDelete,onClose,theme:th}){
  const cM=useMemo(()=>Object.fromEntries(categories.map(c=>[c.id,c])),[categories]);
  const me=events.filter(e=>e.month===month);
  const mh=(holidays||[]).filter(h=>h.month===month);

  // Combine events and holidays into a timeline sorted by day
  const timeline=useMemo(()=>{
    const items=[];
    me.forEach(ev=>items.push({type:"event",day:ev.startDay||1,data:ev}));
    mh.forEach(h=>items.push({type:"holiday",day:h.day,data:h}));
    items.sort((a,b)=>a.day-b.day);
    return items;
  },[me,mh]);

  const totalItems=me.length+mh.length;

  return(<div style={{background:th.card,border:`1px solid ${th.border}`,borderRadius:12,padding:"16px 14px",marginTop:10,animation:"slideIn .2s",color:th.text}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
      <h3 style={{margin:0,fontSize:18,fontWeight:800}}>
        {MF[month]} {new Date().getFullYear()}
        <span style={{color:th.sub,fontWeight:400,fontSize:11,marginLeft:6}}>{me.length} tapahtumaa{mh.length>0?` · ${mh.length} juhlapyhää`:""}</span>
      </h3>
      <div style={{display:"flex",gap:4}}>
        <button onClick={()=>onAdd(month)} style={{padding:"6px 14px",borderRadius:8,border:"none",background:"#5B5EA6",color:"#fff",fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>+ Lisää</button>
        <button onClick={onClose} style={{padding:"6px 12px",borderRadius:8,border:`1px solid ${th.border}`,background:th.card,color:th.muted,fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>✕</button>
      </div>
    </div>

    {totalItems===0?<div style={{color:th.sub,fontSize:11,padding:"16px 0",textAlign:"center"}}>Ei tapahtumia tai juhlapyhiä.</div>:
    <div style={{display:"flex",flexDirection:"column",gap:4}}>
      {timeline.map((item,idx)=>{
        if(item.type==="holiday"){
          const h=item.data;
          return(<div key={`hol${idx}`} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",borderRadius:7,background:"#E8453C0C",borderLeft:"3px solid #E8453C"}}>
            <div style={{width:36,textAlign:"center",flexShrink:0}}>
              <div style={{fontSize:14,fontWeight:800,color:"#E8453C",lineHeight:1}}>{h.day}</div>
              <div style={{fontSize:7,fontWeight:600,color:"#E8453C",opacity:.7}}>{WKDAYS[new Date(new Date().getFullYear(),h.month,h.day).getDay()]}</div>
            </div>
            <div>
              <div style={{fontSize:11,fontWeight:700,color:"#E8453C"}}>{h.name}</div>
              <div style={{fontSize:8,color:th.sub}}>Juhlapyhä</div>
            </div>
          </div>);
        }
        const ev=item.data;
        const cat=cM[ev.categoryId];
        return(<div key={ev.id} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"8px 10px",borderRadius:7,background:th.alt,borderLeft:`3px solid ${ev.eventColor||cat?.color||th.border}`}}>
          <div style={{width:36,textAlign:"center",flexShrink:0}}>
            <div style={{fontSize:14,fontWeight:800,color:th.text,lineHeight:1}}>{ev.startDay||"–"}</div>
            {ev.startDay&&<div style={{fontSize:7,fontWeight:600,color:th.sub}}>{WKDAYS[new Date(new Date().getFullYear(),month,ev.startDay).getDay()]}</div>}
            {ev.endDay&&ev.endDay!==ev.startDay&&<div style={{fontSize:7,color:th.sub}}>→{ev.endDay}.</div>}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
              <span style={{fontWeight:700,fontSize:12,color:th.text}}>{ev.title}</span>
              {cat&&<span style={{fontSize:7,padding:"1px 5px",borderRadius:99,background:cat.color+"33",color:cat.color,fontWeight:600}}>{cat.name}</span>}
              {ev.tags&&ev.tags.map(t=>{const tag=TAGS.find(x=>x.id===t);return tag?<span key={t} style={{fontSize:6,padding:"1px 4px",borderRadius:99,background:tag.color+"22",color:tag.color,fontWeight:700}}>{tag.name}</span>:null})}
            </div>
            {ev.desc&&<div style={{fontSize:10,color:th.muted,marginTop:2,lineHeight:1.4}}>{ev.desc}</div>}
          </div>
          <div style={{display:"flex",gap:2,flexShrink:0}}>
            <button onClick={()=>onEdit(ev)} style={{background:"none",border:"none",cursor:"pointer",color:th.muted,fontSize:11}}>✎</button>
            <button onClick={()=>onDelete(ev.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#ef4444",fontSize:11}}>✕</button>
          </div>
        </div>);
      })}
    </div>}
  </div>);
}

/* ═══ App ═══ */
function App(){
  const[init]=useState(()=>{
    const p=new URLSearchParams(window.location.search),enc=p.get("d");
    if(enc){const s=decS(enc);if(s)return{clocks:[{id:uid(),name:s.name,events:(s.events||[]).map(e=>({...e,tags:e.tags||[],startDay:e.startDay||null,endDay:e.endDay||null})),categories:(s.categories||[]).map(c=>({...c,visible:c.visible!==false})),settings:{...DS,...(s.settings||{})}}],fromShare:true}}
    const st=ld();if(st)return{clocks:st.map(c=>({...c,events:(c.events||[]).map(e=>({...e,tags:e.tags||[],startDay:e.startDay||null,endDay:e.endDay||null})),categories:(c.categories||[]).map(ct=>({...ct,visible:ct.visible!==false})),settings:{...DS,...(c.settings||{})}})),fromShare:false};return null;
  });

  const[showOB,setShowOB]=useState(!init);const[clocks,setClocks]=useState(init?init.clocks:[]);const[acId,setAcId]=useState(init?.clocks?.[0]?.id||"");
  const[view,setView]=useState("clock");const[selM,setSelM]=useState(null);const[editEv,setEditEv]=useState(null);
  const[showCat,setShowCat]=useState(false);const[showSett,setShowSett]=useState(false);const[showShare,setShowShare]=useState(false);const[showSB,setShowSB]=useState(true);
  const[editName,setEditName]=useState(false);const[dayRing,setDayRing]=useState(false);const[nameVal,setNameVal]=useState("");const[toast,setToast]=useState(null);

  useEffect(()=>{if(init?.fromShare){setToast("Jaettu vuosikello avattu!");setTimeout(()=>setToast(null),3000);window.history.replaceState({},"",window.location.pathname)}},[]);
  useEffect(()=>{if(clocks.length>0)sv(clocks)},[clocks]);

  const clock=clocks.find(c=>c.id===acId)||clocks[0];const th=useTh(clock?.settings?.theme||"light");
  const visCIds=clock?clock.categories.filter(c=>c.visible).map(c=>c.id):[];
  const fEv=clock?clock.events.filter(e=>visCIds.includes(e.categoryId)):[];
  const holidays=clock?.settings?.showHolidays?FI_HOLIDAYS:[];
  const upd=useCallback(u=>setClocks(p=>p.map(c=>c.id===acId?{...c,...u}:c)),[acId]);
  const onOB=nc=>{setClocks(nc);setAcId(nc[0].id);setShowOB(false)};
  const saveEv=ev=>{
    if(Array.isArray(ev)){
      // Recurring: add multiple new events
      upd({events:[...clock.events,...ev]});
    } else {
      const ex=clock.events.find(e=>e.id===ev.id);
      if(ex)upd({events:clock.events.map(e=>e.id===ev.id?ev:e)});
      else upd({events:[...clock.events,ev]});
    }
    setEditEv(null);
  };

  if(showOB)return<Onboarding onComplete={onOB}/>;
  if(!clock)return null;

  const customBg=clock?.settings?.customBg;
  return(<div style={{minHeight:"100vh",background:customBg||th.bg,fontFamily:"'DM Sans',sans-serif",color:th.text,transition:"background .3s"}}>
    <header style={{height:56,padding:"0 16px",borderBottom:`1px solid ${th.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",background:th.card,gap:6}}>
      <div style={{display:"flex",alignItems:"center",gap:6}}>
        <button onClick={()=>setShowSB(!showSB)} style={{background:"none",border:"none",color:th.muted,cursor:"pointer",fontSize:18,padding:"4px 8px"}}>☰</button>
        <div style={{width:30,height:30,borderRadius:7,background:"linear-gradient(135deg,#5B5EA6,#3A8FCD)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:10,fontWeight:800}}>◎</div>
        {editName?<div style={{display:"flex",gap:3,alignItems:"center"}}>
          <input value={nameVal} onChange={e=>setNameVal(e.target.value)} style={{width:150,fontSize:11,padding:"2px 6px",borderRadius:5,border:`1px solid ${th.border}`,background:th.alt,color:th.text,fontFamily:"inherit",outline:"none"}} autoFocus onKeyDown={e=>{if(e.key==="Enter"&&nameVal.trim()){upd({name:nameVal.trim()});setEditName(false)}if(e.key==="Escape")setEditName(false)}}/>
          <button onClick={()=>{if(nameVal.trim()){upd({name:nameVal.trim()});setEditName(false)}}} style={{background:"none",border:"none",color:"#22C55E",cursor:"pointer",fontSize:12}}>✓</button></div>:
        <button onClick={()=>{setNameVal(clock.name);setEditName(true)}} style={{background:"none",border:"none",cursor:"pointer",fontFamily:"inherit",fontWeight:800,fontSize:14,color:th.text,padding:0}}>{clock.name} <span style={{fontSize:8,color:th.sub}}>✎</span></button>}
      </div>
      <div style={{display:"flex",gap:3,alignItems:"center",flexWrap:"wrap"}}>
        <div style={{display:"flex",borderRadius:5,overflow:"hidden",border:`1px solid ${th.border}`,marginRight:2}}>
          {[["clock","◎"],["roadmap","🗺"],["timeline","⏐"],["list","≡"]].map(([v,ic])=><button key={v} onClick={()=>setView(v)} style={{padding:"5px 12px",border:"none",fontSize:12,fontWeight:700,fontFamily:"inherit",cursor:"pointer",background:view===v?"#5B5EA6":th.card,color:view===v?"#fff":th.muted}}>{ic}</button>)}</div>
        <button onClick={()=>setDayRing(!dayRing)} style={{fontSize:11,padding:"8px 16px",borderRadius:8,border:dayRing?`1.5px solid #5B5EA6`:`1.5px solid ${th.border}`,background:dayRing?"#5B5EA622":th.card,color:dayRing?"#5B5EA6":th.muted,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}} title="Päivärengas">{dayRing?"📅 Päivät":"📅"}</button>
        {clocks.length>1&&clocks.map(c=><button key={c.id} onClick={()=>{setAcId(c.id);setSelM(null)}} style={{fontSize:11,padding:"8px 14px",borderRadius:8,border:c.id===acId?"none":`1px solid ${th.border}`,background:c.id===acId?"#5B5EA6":th.card,color:c.id===acId?"#fff":th.muted,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{c.name}</button>)}
        <button onClick={()=>{const id=uid();setClocks(p=>[...p,{id,name:"Uusi",events:[],categories:[{id:uid(),name:"Yleinen",color:"#A8C5DA",visible:true}],settings:{...DS,theme:clock?.settings?.theme||"light"}}]);setAcId(id)}} style={{fontSize:11,padding:"8px 14px",borderRadius:8,border:`1px solid ${th.border}`,background:th.card,color:th.muted,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>+</button>
        <div style={{width:1,height:14,background:th.border}}/>
        <button onClick={()=>setShowShare(true)} style={{fontSize:11,padding:"8px 16px",borderRadius:8,border:"none",background:"#5B5EA6",color:"#fff",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>🔗</button>
        <button onClick={()=>{const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(Array.isArray(d)){setClocks(d.map(c=>({...c,events:(c.events||[]).map(e2=>({...e2,tags:e2.tags||[],startDay:e2.startDay||null,endDay:e2.endDay||null})),categories:(c.categories||[]).map(ct=>({...ct,visible:ct.visible!==false})),settings:{...DS,...(c.settings||{})}})));setAcId(d[0].id)}}catch{}};r.readAsText(f)};i.click()}} style={{fontSize:11,padding:"8px 14px",borderRadius:8,border:`1px solid ${th.border}`,background:th.card,color:th.muted,cursor:"pointer",fontFamily:"inherit"}}>📂</button>
        <button onClick={()=>{if(confirm("Nollaa?")){localStorage.removeItem(SK);setClocks([]);setShowOB(true)}}} style={{fontSize:10,padding:"4px 8px",borderRadius:5,border:`1px solid ${th.border}`,background:th.card,color:"#ef4444",cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>×</button>
      </div>
    </header>
    <div style={{display:"flex",height:"calc(100vh - 56px)"}}>
      <Sidebar clock={clock} onUpdate={upd} onMonthClick={m=>setSelM(selM===m?null:m)} selectedMonth={selM} showSB={showSB} setShowSB={setShowSB} setShowCat={setShowCat} setShowSett={setShowSett} theme={th}/>
      <div style={{flex:1,overflowY:"auto",padding:"10px 14px"}}>
        <div style={{display:"flex",justifyContent:"flex-end",marginBottom:8,gap:3}}>
          <button onClick={()=>setShowCat(true)} style={{fontSize:11,padding:"8px 16px",borderRadius:8,border:`1px solid ${th.border}`,background:th.card,color:th.muted,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>🏷</button>
          <button onClick={()=>setShowSett(true)} style={{fontSize:11,padding:"8px 16px",borderRadius:8,border:`1px solid ${th.border}`,background:th.card,color:th.muted,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>⚙️</button>
          <button onClick={()=>setEditEv({month:selM??new Date().getMonth()})} style={{fontSize:11,padding:"5px 14px",borderRadius:6,border:"none",background:"#5B5EA6",color:"#fff",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>+ Tapahtuma</button>
        </div>

        {/* Clock + side panel layout */}
        {view==="clock"&&(
          <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
            <div style={{flex:"1 1 auto",minWidth:0}}>
              <CircularClock events={fEv} categories={clock.categories.filter(c=>c.visible)} onMonthClick={m=>setSelM(selM===m?null:m)} onEventClick={ev=>setEditEv(ev)} clockTitle={clock.name} selectedMonth={selM} settings={clock.settings||DS} theme={th} holidays={holidays} showDayRing={dayRing}/>
            </div>
            {selM!==null&&(
              <div style={{width:300,flexShrink:0,overflowY:"auto",maxHeight:"calc(100vh - 100px)"}}>
                <MonthPanel month={selM} events={fEv} categories={clock.categories} holidays={holidays} onAdd={m=>setEditEv({month:m})} onEdit={ev=>setEditEv(ev)} onDelete={id=>upd({events:clock.events.filter(e=>e.id!==id)})} onClose={()=>setSelM(null)} theme={th}/>
              </div>
            )}
          </div>
        )}

        {view==="roadmap"&&<RoadmapView events={fEv} categories={clock.categories.filter(c=>c.visible)} onEventClick={ev=>setEditEv(ev)} clockTitle={clock.name} theme={th}/>}
        {view==="timeline"&&<TimelineView events={fEv} categories={clock.categories.filter(c=>c.visible)} onEventClick={ev=>setEditEv(ev)} clockTitle={clock.name} theme={th}/>}
        {view==="list"&&<ListView events={fEv} categories={clock.categories} onMonthClick={m=>setSelM(selM===m?null:m)} onEventClick={ev=>setEditEv(ev)} theme={th}/>}

        {/* MonthPanel for non-clock views stays below */}
        {selM!==null&&view!=="clock"&&view!=="timeline"&&view!=="roadmap"&&<MonthPanel month={selM} events={fEv} categories={clock.categories} holidays={holidays} onAdd={m=>setEditEv({month:m})} onEdit={ev=>setEditEv(ev)} onDelete={id=>upd({events:clock.events.filter(e=>e.id!==id)})} onClose={()=>setSelM(null)} theme={th}/>}
      </div>
    </div>
    {editEv&&<EventModal event={editEv.id?editEv:null} month={editEv.month} categories={clock.categories} onSave={saveEv} onCancel={()=>setEditEv(null)} theme={th}/>}
    {showCat&&<CatModal categories={clock.categories} onSave={cats=>{upd({categories:cats.map(c=>({...c,visible:c.visible!==false}))});setShowCat(false)}} onCancel={()=>setShowCat(false)} theme={th}/>}
    {showSett&&<SettModal settings={clock.settings||DS} onSave={s=>{upd({settings:s});setShowSett(false)}} onCancel={()=>setShowSett(false)} theme={th}/>}
    {showShare&&<ShareModal clock={clock} onClose={()=>setShowShare(false)} theme={th}/>}
    {toast&&<div className="toast">{toast}</div>}
  </div>);
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
