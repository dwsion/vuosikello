<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vuosikello</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#c4c9d4;border-radius:4px}
button{font-family:inherit;cursor:pointer;transition:all 0.15s}button:hover{filter:brightness(1.06)}
input:focus,textarea:focus,select:focus{outline:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:12px 24px;border-radius:10px;font-size:13px;font-weight:600;z-index:2000;animation:slideIn 0.3s;box-shadow:0 8px 24px rgba(0,0,0,0.25)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useRef,useCallback,useMemo,useEffect}=React;
const MF=["Tammikuu","Helmikuu","Maaliskuu","Huhtikuu","Toukokuu","Kesäkuu","Heinäkuu","Elokuu","Syyskuu","Lokakuu","Marraskuu","Joulukuu"];
const MS=["Tammi","Helmi","Maalis","Huhti","Touko","Kesä","Heinä","Elo","Syys","Loka","Marras","Joulu"];

const EC=[{id:"default",name:"Oletus",color:null},{id:"red",name:"Kriittinen",color:"#E8453C"},{id:"orange",name:"Tärkeä",color:"#F59E0B"},{id:"green",name:"Normaali",color:"#22C55E"},{id:"blue",name:"Info",color:"#3B82F6"},{id:"purple",name:"Suunnittelu",color:"#8B5CF6"},{id:"pink",name:"Tapahtuma",color:"#EC4899"},{id:"gray",name:"Valmis",color:"#94A3B8"}];

const BG_COLORS=[{id:"light",name:"Vaalea",bg:"#f0f2f5",text:"#1a1a2e",card:"#fff",border:"#e2e8f0",muted:"#64748b",sub:"#94a3b8",cardAlt:"#f8fafc"},
  {id:"warm",name:"Lämmin",bg:"#faf5ef",text:"#2d1f0e",card:"#fff",border:"#e8dfd4",muted:"#8b7e6a",sub:"#a89880",cardAlt:"#fdfaf5"},
  {id:"cool",name:"Viileä",bg:"#eef1f6",text:"#1a2035",card:"#fff",border:"#d8dde8",muted:"#5a6580",sub:"#8892a8",cardAlt:"#f5f7fb"},
  {id:"dark",name:"Tumma",bg:"#13151a",text:"#e2e8f0",card:"#1e2028",border:"#2a2d38",muted:"#8892a8",sub:"#64748b",cardAlt:"#252830"}];

const TEMPLATES=[
  {id:"empty",name:"Tyhjä vuosikello",desc:"Aloita puhtaalta pöydältä",icon:"📝",
    categories:[{id:"c1",name:"Yleinen",color:"#A8C5DA",visible:true}],events:[]},
  {id:"business",name:"Yrityksen vuosikello",desc:"Hallinto, talous, HR ja viestintä",icon:"🏢",
    categories:[{id:"c1",name:"Hallinto",color:"#A8C5DA",visible:true},{id:"c2",name:"Talous",color:"#B5D8C7",visible:true},{id:"c3",name:"Henkilöstö",color:"#E8B4B8",visible:true},{id:"c4",name:"Viestintä",color:"#F5D5A0",visible:true}],
    events:[{id:"e1",month:0,title:"Vuosisuunnittelu",categoryId:"c1",eventColor:null},{id:"e2",month:0,title:"Tilinpäätös",categoryId:"c2",eventColor:"#E8453C"},{id:"e3",month:1,title:"Kehityskeskustelut",categoryId:"c3",eventColor:null},{id:"e4",month:2,title:"Q1-raportointi",categoryId:"c2",eventColor:"#F59E0B"},{id:"e5",month:3,title:"Kevättiedote",categoryId:"c4",eventColor:null},{id:"e6",month:5,title:"Puolivuotiskatsaus",categoryId:"c1",eventColor:"#F59E0B"},{id:"e7",month:8,title:"Q3-raportointi",categoryId:"c2",eventColor:null},{id:"e8",month:9,title:"Budjetointi",categoryId:"c2",eventColor:"#E8453C"},{id:"e9",month:11,title:"Vuosikatsaus",categoryId:"c4",eventColor:"#22C55E"},{id:"e10",month:11,title:"Pikkujoulut",categoryId:"c3",eventColor:"#EC4899"}]},
  {id:"hr",name:"HR-vuosikello",desc:"Henkilöstöhallinnon prosessit",icon:"👥",
    categories:[{id:"h1",name:"Rekrytointi",color:"#A8C5DA",visible:true},{id:"h2",name:"Osaaminen",color:"#B8B5D8",visible:true},{id:"h3",name:"Hyvinvointi",color:"#B5D8C7",visible:true},{id:"h4",name:"Palkitseminen",color:"#F5D5A0",visible:true}],
    events:[{id:"h1e",month:0,title:"Kehityskeskustelut",categoryId:"h2",eventColor:null},{id:"h2e",month:2,title:"Kevätrekry",categoryId:"h1",eventColor:null},{id:"h3e",month:3,title:"Hyvinvointikysely",categoryId:"h3",eventColor:"#F59E0B"},{id:"h4e",month:5,title:"Bonus H1",categoryId:"h4",eventColor:"#22C55E"},{id:"h5e",month:7,title:"Syysrekry",categoryId:"h1",eventColor:null},{id:"h6e",month:10,title:"Palkka-arviointi",categoryId:"h4",eventColor:"#E8453C"}]},
  {id:"project",name:"Projektin vuosikello",desc:"Projektin vaiheet ja virstanpylväät",icon:"🎯",
    categories:[{id:"p1",name:"Suunnittelu",color:"#B8B5D8",visible:true},{id:"p2",name:"Toteutus",color:"#A8C5DA",visible:true},{id:"p3",name:"Testaus",color:"#F5D5A0",visible:true},{id:"p4",name:"Julkaisu",color:"#B5D8C7",visible:true}],events:[]},
  {id:"education",name:"Koulun lukuvuosi",desc:"Lukukaudet, lomat ja tapahtumat",icon:"📚",
    categories:[{id:"k1",name:"Opetus",color:"#A8C5DA",visible:true},{id:"k2",name:"Arviointi",color:"#E8B4B8",visible:true},{id:"k3",name:"Tapahtumat",color:"#F5D5A0",visible:true},{id:"k4",name:"Lomat",color:"#B5D8C7",visible:true}],
    events:[{id:"k1e",month:0,title:"Kevätlukukausi",categoryId:"k1",eventColor:null},{id:"k2e",month:1,title:"Hiihtoloma",categoryId:"k4",eventColor:"#3B82F6"},{id:"k3e",month:4,title:"Kevätjuhla",categoryId:"k3",eventColor:"#EC4899"},{id:"k4e",month:5,title:"Kesäloma",categoryId:"k4",eventColor:"#22C55E"},{id:"k5e",month:7,title:"Syyslukukausi",categoryId:"k1",eventColor:null},{id:"k6e",month:11,title:"Joululoma",categoryId:"k4",eventColor:"#22C55E"}]},
  {id:"marketing",name:"Markkinoinnin vuosikello",desc:"Kampanjat ja sisällöt",icon:"📣",
    categories:[{id:"m1",name:"Kampanjat",color:"#E8B4B8",visible:true},{id:"m2",name:"Sisältö",color:"#A8C5DA",visible:true},{id:"m3",name:"Tapahtumat",color:"#F5D5A0",visible:true},{id:"m4",name:"Analytiikka",color:"#B5D8C7",visible:true}],events:[]},
];

const uid=()=>"id_"+Math.random().toString(36).slice(2,10);
const p2c=(cx,cy,r,d)=>{const rad=(d-90)*(Math.PI/180);return[cx+r*Math.cos(rad),cy+r*Math.sin(rad)]};
const aP=(cx,cy,rO,rI,s,e)=>{const[a,b]=p2c(cx,cy,rO,s),[c,d]=p2c(cx,cy,rO,e),[f,g]=p2c(cx,cy,rI,e),[h,j]=p2c(cx,cy,rI,s),l=e-s>180?1:0;return`M${a},${b} A${rO},${rO} 0 ${l},1 ${c},${d} L${f},${g} A${rI},${rI} 0 ${l},0 ${h},${j} Z`};

const SK="vuosikello_v5";
const sv=d=>{try{localStorage.setItem(SK,JSON.stringify(d))}catch{}};
const ld=()=>{try{const r=localStorage.getItem(SK);if(r){const d=JSON.parse(r);if(Array.isArray(d)&&d.length)return d}}catch{};return null};
const encS=c=>{try{return LZString.compressToEncodedURIComponent(JSON.stringify({name:c.name,events:c.events,categories:c.categories,settings:c.settings}))}catch{return null}};
const decS=s=>{try{const j=LZString.decompressFromEncodedURIComponent(s);if(j){const d=JSON.parse(j);if(d.name)return d}}catch{};return null};

const DS={revolving:true,clockwise:true,startMonth:0,theme:"light"};

// Theme hook
function useTheme(themeId){
  return BG_COLORS.find(t=>t.id===themeId)||BG_COLORS[0];
}

/* ═══ Mini Clock Preview for Templates ═══ */
function MiniClock({categories,events,size:sz}){
  const s=sz||90,cx=s/2,cy=s/2,iR=s*0.18,rS=s*0.25,rG=1;
  const rW=(s/2-rS-2)/Math.max(categories.length,1)-rG;
  return(<svg viewBox={`0 0 ${s} ${s}`} width={sz} height={sz} style={{display:"block"}}>
    {categories.map((cat,ri)=>{
      const rO=rS+(ri+1)*(rW+rG)-rG,rI=rS+ri*(rW+rG);
      return(<g key={ri}>{Array.from({length:12},(_,mi)=>{
        const hasEv=events.some(e=>e.month===mi&&e.categoryId===cat.id);
        return<path key={mi} d={aP(cx,cy,rO,rI,mi*30,(mi+1)*30)} fill={cat.color} opacity={hasEv?0.7:0.25} stroke="#fff" strokeWidth="0.5"/>;
      })}</g>);
    })}
    <circle cx={cx} cy={cy} r={rS} fill="#f8fafc" stroke="#e2e8f0" strokeWidth="0.5"/>
    <circle cx={cx} cy={cy} r={iR} fill="#fff"/>
    {/* Event dots */}
    {events.slice(0,20).map((ev,i)=>{
      const cat=categories.find(c=>c.id===ev.categoryId);if(!cat)return null;
      const ri=categories.indexOf(cat),rI2=rS+ri*(rW+rG)+1,rO2=rS+(ri+1)*(rW+rG)-rG-1;
      const rM=(rI2+rO2)/2,mid=ev.month*30+15;
      const[x,y]=p2c(cx,cy,rM,mid);
      return<circle key={i} cx={x} cy={y} r={Math.max(1.5,rW/4)} fill={ev.eventColor||"#fff"} opacity="0.9"/>;
    })}
  </svg>);
}

/* ═══ Onboarding ═══ */
function Onboarding({onComplete}){
  const[view,setView]=useState("gallery");
  const[sel,setSel]=useState(null);
  const[name,setName]=useState("");
  const[sett,setSett]=useState({...DS});

  const go=t=>{setSel(t);setName(t.name==="Tyhjä vuosikello"?"":t.name);setView("setup")};
  const finish=()=>{
    const cats=sel.categories.map(c=>({...c,id:uid(),visible:true}));
    const evts=sel.events.map(e=>{const oi=sel.categories.findIndex(c=>c.id===e.categoryId);return{...e,id:uid(),desc:e.desc||"",categoryId:cats[oi>=0?oi:0].id}});
    onComplete([{id:uid(),name:name.trim()||"Vuosikello",categories:cats,events:evts,settings:sett}]);
  };

  if(view==="gallery")return(
    <div style={{minHeight:"100vh",background:"#f0f2f5",padding:"40px 20px"}}>
      <div style={{maxWidth:960,margin:"0 auto"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:36}}>
          <div style={{width:48,height:48,borderRadius:14,background:"linear-gradient(135deg,#5B5EA6,#3A8FCD)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:24,fontWeight:800}}>◎</div>
          <div><h1 style={{fontSize:26,fontWeight:800,margin:0}}>Vuosikello</h1><div style={{fontSize:14,color:"#94a3b8"}}>Valitse pohja tai aloita tyhjästä</div></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:14}}>
          {TEMPLATES.map(t=>(
            <button key={t.id} onClick={()=>go(t)} style={{padding:"20px 16px",borderRadius:14,border:"1.5px solid #e2e8f0",background:"#fff",cursor:"pointer",textAlign:"center",fontFamily:"inherit",transition:"all 0.2s",display:"flex",flexDirection:"column",alignItems:"center"}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor="#5B5EA6";e.currentTarget.style.boxShadow="0 4px 20px rgba(91,94,166,0.12)"}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor="#e2e8f0";e.currentTarget.style.boxShadow="none"}}>
              <MiniClock categories={t.categories} events={t.events} size={110}/>
              <div style={{fontWeight:800,fontSize:14,marginTop:12,color:"#1a1a2e"}}>{t.name}</div>
              <div style={{fontSize:11,color:"#94a3b8",lineHeight:1.4,marginTop:4}}>{t.desc}</div>
              <div style={{fontSize:9,color:"#cbd5e1",marginTop:8}}>{t.categories.length} kehää · {t.events.length} tapahtumaa</div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );

  return(<div style={{minHeight:"100vh",background:"#f0f2f5",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div style={{background:"#fff",borderRadius:20,padding:"32px 28px",maxWidth:500,width:"100%",boxShadow:"0 4px 24px rgba(0,0,0,0.06)",animation:"fadeIn 0.3s"}}>
      <button onClick={()=>setView("gallery")} style={{background:"none",border:"none",color:"#5B5EA6",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:16,padding:0}}>← Takaisin pohjiin</button>
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:24}}>
        <MiniClock categories={sel.categories} events={sel.events} size={70}/>
        <div><h2 style={{fontSize:18,fontWeight:800,margin:0}}>{sel.name}</h2><div style={{fontSize:12,color:"#94a3b8"}}>{sel.desc}</div></div>
      </div>
      <label style={lbl}>Vuosikellon nimi</label>
      <input value={name} onChange={e=>setName(e.target.value)} placeholder="Anna nimi..." style={{...inp,fontSize:15,padding:"12px 14px"}} autoFocus/>
      <label style={lbl}>Kellon tyyppi</label>
      <div style={{display:"flex",marginBottom:14,borderRadius:8,overflow:"hidden",border:"1.5px solid #e2e8f0"}}>
        {[{v:true,l:"Pyörivä",d:"Kuluva kk ylös"},{v:false,l:"Staattinen",d:"Tammi ylhäällä"}].map(o=>(
          <button key={String(o.v)} onClick={()=>setSett({...sett,revolving:o.v})} style={{flex:1,padding:"10px 8px",border:"none",fontSize:12,fontWeight:700,fontFamily:"inherit",cursor:"pointer",background:sett.revolving===o.v?"#5B5EA6":"#f8fafc",color:sett.revolving===o.v?"#fff":"#64748b",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
            <span>{o.l}</span><span style={{fontSize:9,opacity:0.7}}>{o.d}</span></button>
        ))}
      </div>
      <label style={lbl}>Suunta</label>
      <div style={{display:"flex",marginBottom:14,borderRadius:8,overflow:"hidden",border:"1.5px solid #e2e8f0"}}>
        {[{v:true,l:"Myötäpäivään ↻"},{v:false,l:"Vastapäivään ↺"}].map(o=>(
          <button key={String(o.v)} onClick={()=>setSett({...sett,clockwise:o.v})} style={{flex:1,padding:"10px",border:"none",fontSize:12,fontWeight:700,fontFamily:"inherit",cursor:"pointer",background:sett.clockwise===o.v?"#5B5EA6":"#f8fafc",color:sett.clockwise===o.v?"#fff":"#64748b"}}>{o.l}</button>
        ))}
      </div>
      <label style={lbl}>Teema</label>
      <div style={{display:"flex",gap:6,marginBottom:20}}>
        {BG_COLORS.map(t=><button key={t.id} onClick={()=>setSett({...sett,theme:t.id})} style={{flex:1,padding:"8px",borderRadius:8,border:sett.theme===t.id?"2px solid #5B5EA6":"2px solid transparent",background:t.bg,color:t.text,fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{t.name}</button>)}
      </div>
      <button onClick={finish} style={{width:"100%",padding:"12px",borderRadius:10,border:"none",background:"#5B5EA6",color:"#fff",fontSize:14,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>Luo vuosikello →</button>
    </div>
  </div>);
}

/* ═══ Shared styles (functions for theme) ═══ */
const lbl={display:"block",color:"#64748b",fontSize:11,fontWeight:700,marginBottom:4,letterSpacing:"0.04em"};
const inp={width:"100%",padding:"9px 12px",borderRadius:8,border:"1.5px solid #e2e8f0",background:"#fff",color:"#1a1a2e",fontSize:13,marginBottom:12,fontFamily:"inherit",outline:"none"};
const makeBtn=(th)=>(bg,color)=>({padding:"7px 14px",borderRadius:8,border:"none",background:bg||th.card,color:color||th.text,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"});
const makeOvr=(th)=>({position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16,backdropFilter:"blur(4px)"});
const makeMod=(th)=>({background:th.card,borderRadius:16,padding:24,width:"100%",maxWidth:480,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 24px 48px rgba(0,0,0,0.2)",color:th.text,border:`1px solid ${th.border}`});

/* ═══ Circular Clock ═══ */
function CircularClock({events,categories,onMonthClick,onEventClick,clockTitle,selectedMonth,settings,theme:th}){
  const[hov,setHov]=useState(null);const[tip,setTip]=useState(null);const ref=useRef(null);
  const vc=categories.filter(c=>c.visible);
  const sz=780,cx=sz/2,cy=sz/2,iR=85,mlR=108,rS=125,rG=3;
  const rW=Math.min(55,(sz/2-rS-16)/Math.max(vc.length,1)-rG);
  const oR=rS+vc.length*(rW+rG);
  const cM=useMemo(()=>Object.fromEntries(vc.map((c,i)=>[c.id,{...c,ri:i}])),[vc]);
  const cm=new Date().getMonth();
  const s=settings||DS;
  const rOff=s.revolving?-(cm*30+15):-(s.startMonth*30);
  const dir=s.clockwise?1:-1;
  const mD=mi=>mi*30*dir+rOff;
  const hMM=(e,ev)=>{if(!ref.current)return;const r=ref.current.getBoundingClientRect();setTip({x:e.clientX-r.left,y:e.clientY-r.top,ev})};
  const eRM=useMemo(()=>{const m={};events.forEach(ev=>{const c=cM[ev.categoryId];if(!c)return;const k=`${c.ri}-${ev.month}`;if(!m[k])m[k]=[];m[k].push(ev)});return m},[events,cM]);

  return(<div style={{position:"relative",width:"100%",maxWidth:sz,margin:"0 auto"}}>
    <svg ref={ref} viewBox={`0 0 ${sz} ${sz}`} style={{width:"100%",height:"auto",fontFamily:"'DM Sans',sans-serif"}} onMouseLeave={()=>setTip(null)}>
      <defs><filter id="bs"><feDropShadow dx="0" dy="1" stdDeviation="1.5" floodOpacity="0.2"/></filter></defs>
      {vc.map((cat,ri)=>{const rO2=rS+(ri+1)*(rW+rG)-rG,rI2=rS+ri*(rW+rG);
        return(<g key={cat.id}>{MF.map((_,mi)=>{const sd=mD(mi),ed=mD(mi)+30*dir,s2=Math.min(sd,ed),e2=Math.max(sd,ed);
          return<path key={mi} d={aP(cx,cy,rO2,rI2,s2,e2)} fill={cat.color} opacity={mi===selectedMonth?0.75:mi===cm?0.6:0.35} stroke={th.card} strokeWidth="1" onClick={()=>onMonthClick(mi)} style={{cursor:"pointer"}}/>;
        })}</g>);})}
      {Array.from({length:12},(_,i)=>{const d=mD(i),[x1,y1]=p2c(cx,cy,rS,d),[x2,y2]=p2c(cx,cy,oR,d);return<line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={th.card+"99"} strokeWidth="1.5"/>})}
      <circle cx={cx} cy={cy} r={rS} fill={th.cardAlt} stroke={th.border} strokeWidth="1"/>
      <circle cx={cx} cy={cy} r={iR} fill={th.card} stroke={th.border} strokeWidth="1"/>
      {MF.map((nm,i)=>{const md=mD(i)+15*dir,[lx,ly]=p2c(cx,cy,mlR,md),rot=md,fl=rot>90&&rot<270;
        return<text key={i} x={lx} y={ly} textAnchor="middle" dominantBaseline="central" fill={i===cm?"#5B5EA6":th.muted} fontSize="10" fontWeight={i===cm?"800":"600"} transform={`rotate(${fl?rot+180:rot},${lx},${ly})`} onClick={()=>onMonthClick(i)} style={{cursor:"pointer"}}>{MS[i]}</text>})}
      <text x={cx} y={cy-14} textAnchor="middle" fill={th.text} fontSize="12" fontWeight="800" style={{letterSpacing:"0.06em"}}>{clockTitle||"VUOSIKELLO"}</text>
      <text x={cx} y={cy+6} textAnchor="middle" fill="#5B5EA6" fontSize="22" fontWeight="800">{new Date().getFullYear()}</text>
      <text x={cx} y={cy+22} textAnchor="middle" fill={th.sub} fontSize="9" fontWeight="600">{events.length} tapahtumaa</text>

      {Object.entries(eRM).map(([key,evs])=>{const[riS,miS]=key.split("-");const ri=+riS,mi=+miS;const cat=vc[ri];if(!cat)return null;
        const rI2=rS+ri*(rW+rG)+1.5,rO2=rS+(ri+1)*(rW+rG)-rG-1.5,rM=(rI2+rO2)/2;
        const sd=mD(mi)+0.6*dir,ed=mD(mi)+30*dir-0.6*dir,s2=Math.min(sd,ed),e2=Math.max(sd,ed);
        const n=evs.length,sl=(e2-s2)/n;
        return evs.map((ev,ei)=>{const es=s2+ei*sl+0.3,ee=s2+(ei+1)*sl-0.3,mid=(es+ee)/2;
          const bp=aP(cx,cy,rO2,rI2,es,ee),isH=hov===ev.id;
          const[tx,ty]=p2c(cx,cy,rM,mid),tr=mid,fl=tr>90&&tr<270,fr=fl?tr+180:tr;
          const al=(Math.PI*2*rM*(ee-es))/360,mc=Math.max(2,Math.floor(al/6.2));
          let dt=ev.title;if(dt.length>mc)dt=dt.slice(0,mc-1)+"\u2026";
          const fc=ev.eventColor||th.card,tc=ev.eventColor?"#fff":th.text;
          return(<g key={ev.id} onMouseEnter={()=>setHov(ev.id)} onMouseLeave={()=>{setHov(null);setTip(null)}} onMouseMove={e=>hMM(e,ev)} onClick={e=>{e.stopPropagation();onEventClick(ev)}} style={{cursor:"pointer"}}>
            <path d={bp} fill={fc} opacity={isH?1:ev.eventColor?0.9:0.88} stroke={isH?th.text:th.card+"66"} strokeWidth={isH?1.5:0.5} filter={isH?"url(#bs)":undefined}/>
            <text x={tx} y={ty} textAnchor="middle" dominantBaseline="central" fill={tc} fontSize={rO2-rI2>40?"9.5":"8.5"} fontWeight="700" transform={`rotate(${fr},${tx},${ty})`} style={{pointerEvents:"none",textShadow:ev.eventColor?"0 1px 2px rgba(0,0,0,0.25)":"none"}}>{dt}</text>
          </g>)});})}

      {vc.map((cat,ri)=>{const rM=rS+ri*(rW+rG)+rW/2,pid=`cA${ri}`;
        const la=mD(6.5),lb=mD(8),s2=Math.min(la,lb),e2=Math.max(la,lb);
        const[sx,sy]=p2c(cx,cy,rM,s2),[ex,ey]=p2c(cx,cy,rM,e2);
        return(<g key={cat.id+"_l"}><defs><path id={pid} d={`M${sx},${sy} A${rM},${rM} 0 0,1 ${ex},${ey}`} fill="none"/></defs>
          <text fontSize="8" fontWeight="700" fill={th.text+"55"} style={{letterSpacing:"0.06em"}}><textPath href={`#${pid}`} startOffset="50%" textAnchor="middle">{cat.name}</textPath></text></g>)})}
    </svg>
    {tip&&<div style={{position:"absolute",left:Math.min(tip.x+12,sz-220),top:tip.y-10,background:"#1a1a2e",color:"#f8fafc",padding:"10px 14px",borderRadius:10,fontSize:12,maxWidth:240,zIndex:50,boxShadow:"0 8px 24px rgba(0,0,0,0.3)",pointerEvents:"none",border:`2px solid ${tip.ev.eventColor||cM[tip.ev.categoryId]?.color||"#5B5EA6"}`}}>

      <div style={{fontSize:9,color:"#64748b",marginTop:4}}>{MF[tip.ev.month]} · {cM[tip.ev.categoryId]?.name||""}</div>
    </div>}
  </div>);
}

    <label style={{...lbl,color:th.muted}}>Teema</label>
    <div style={{display:"flex",gap:5,marginBottom:16}}>
      {BG_COLORS.map(t=><button key={t.id} onClick={()=>setS({...s,theme:t.id})} style={{flex:1,padding:"8px 4px",borderRadius:8,border:s.theme===t.id?"2px solid #5B5EA6":`2px solid ${th.border}`,background:t.bg,color:t.text,fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{t.name}</button>)}
    </div>
    <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}><button onClick={onCancel} style={{padding:"6px 12px",borderRadius:7,border:`1px solid ${th.border}`,background:th.card,color:th.muted,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Peruuta</button><button onClick={()=>onSave(s)} style={{padding:"6px 14px",borderRadius:7,border:"none",background:"#5B5EA6",color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Tallenna</button></div>
  </div></div>);
}

function ShareModal({clock,onClose,theme:th}){
  const[cp,setCp]=useState(false);
  const enc=encS(clock);const url=enc?window.location.origin+window.location.pathname+"?d="+enc:null;const big=!url||url.length>8000;
  const copy=()=>{if(url)navigator.clipboard.writeText(url).then(()=>{setCp(true);setTimeout(()=>setCp(false),2000)})};
  const exp=()=>{const b=new Blob([JSON.stringify([clock],null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(clock.name||"vuosikello")+".json";a.click()};
  return(<div style={makeOvr(th)} onClick={onClose}><div onClick={e=>e.stopPropagation()} style={{...makeMod(th),maxWidth:420}}>
    <h3 style={{margin:"0 0 14px",fontSize:16,fontWeight:800}}>Jaa</h3>
    {!big&&<><label style={{...lbl,color:th.muted}}>Jakolinkki</label><div style={{display:"flex",gap:5,marginBottom:10}}><input value={url} readOnly style={{...inp,marginBottom:0,flex:1,fontSize:9,color:th.sub,background:th.cardAlt,borderColor:th.border}} onClick={e=>e.target.select()}/><button onClick={copy} style={{padding:"6px 12px",borderRadius:7,border:"none",background:cp?"#22C55E":"#5B5EA6",color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{cp?"✓":"Kopioi"}</button></div></>}
    <button onClick={exp} style={{width:"100%",padding:"8px",borderRadius:7,border:`1px solid ${th.border}`,background:th.card,color:th.muted,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginBottom:8}}>💾 Lataa JSON</button>
    <div style={{display:"flex",justifyContent:"flex-end"}}><button onClick={onClose} style={{padding:"6px 12px",borderRadius:7,border:`1px solid ${th.border}`,background:th.card,color:th.muted,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Sulje</button></div>
  </div></div>);
}

function handlePrint(t,ev,cats){
  const cm=Object.fromEntries(cats.map(c=>[c.id,c]));
  let h=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${t}</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif;padding:32px}h1{font-size:22px;margin-bottom:20px}.mo{page-break-inside:avoid;margin-bottom:14px}.mt{font-size:14px;font-weight:800;border-bottom:2px solid #e2e8f0;padding-bottom:3px;margin-bottom:6px}.ev{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #f1f5f9}.d{width:8px;height:8px;border-radius:2px;margin-top:3px}.et{font-weight:700;font-size:12px}.ed{font-size:11px;color:#64748b}</style></head><body><h1>${t} — ${new Date().getFullYear()}</h1>`;
  MF.forEach((n,i)=>{const me=ev.filter(e=>e.month===i);if(!me.length)return;h+=`<div class="mo"><div class="mt">${n}</div>`;me.forEach(e=>{const c=cm[e.categoryId];h+=`<div class="ev"><div class="d" style="background:${e.eventColor||c?.color||'#ccc'}"></div><div><div class="et">${e.title}</div>${e.desc?`<div class="ed">${e.desc}</div>`:""}</div></div>`});h+=`</div>`});
  h+=`</body></html>`;const w=window.open("","_blank");w.document.write(h);w.document.close();setTimeout(()=>w.print(),300);
}

/* ═══ App ═══ */
function App(){
  const[init]=useState(()=>{
    const p=new URLSearchParams(window.location.search),enc=p.get("d");
    if(enc){const s=decS(enc);if(s)return{clocks:[{id:uid(),name:s.name,events:s.events||[],categories:(s.categories||[]).map(c=>({...c,visible:c.visible!==false})),settings:s.settings||DS}],fromShare:true}}
    const st=ld();if(st)return{clocks:st.map(c=>({...c,categories:(c.categories||[]).map(ct=>({...ct,visible:ct.visible!==false})),settings:c.settings||DS})),fromShare:false};return null;
  });

  const[showOB,setShowOB]=useState(!init);
  const[clocks,setClocks]=useState(init?init.clocks:[]);
  const[acId,setAcId]=useState(init?.clocks?.[0]?.id||"");
  const[view,setView]=useState("clock");
  const[selM,setSelM]=useState(null);
  const[editEv,setEditEv]=useState(null);
  const[showCat,setShowCat]=useState(false);
  const[showSett,setShowSett]=useState(false);
  const[showShare,setShowShare]=useState(false);
  const[showSB,setShowSB]=useState(true);
  const[editName,setEditName]=useState(false);
  const[nameVal,setNameVal]=useState("");
  const[toast,setToast]=useState(null);

  useEffect(()=>{if(init?.fromShare){setToast("Jaettu vuosikello avattu!");setTimeout(()=>setToast(null),3000);window.history.replaceState({},"",window.location.pathname)}},[]);
  useEffect(()=>{if(clocks.length>0)sv(clocks)},[clocks]);

  const clock=clocks.find(c=>c.id===acId)||clocks[0];
  const th=useTheme(clock?.settings?.theme||"light");
  const visCIds=clock?clock.categories.filter(c=>c.visible).map(c=>c.id):[];
  const fEv=clock?clock.events.filter(e=>visCIds.includes(e.categoryId)):[];

  const upd=useCallback(u=>setClocks(p=>p.map(c=>c.id===acId?{...c,...u}:c)),[acId]);
  const onOB=nc=>{setClocks(nc);setAcId(nc[0].id);setShowOB(false)};
  const addClock=()=>{const id=uid();setClocks(p=>[...p,{id,name:"Uusi kello",events:[],categories:[{id:uid(),name:"Yleinen",color:"#A8C5DA",visible:true}],settings:{...DS,theme:clock?.settings?.theme||"light"}}]);setAcId(id)};
  const saveEv=ev=>{const ex=clock.events.find(e=>e.id===ev.id);if(ex)upd({events:clock.events.map(e=>e.id===ev.id?ev:e)});else upd({events:[...clock.events,ev]});setEditEv(null)};
  const delEv=id=>upd({events:clock.events.filter(e=>e.id!==id)});
  const importData=()=>{const inp2=document.createElement("input");inp2.type="file";inp2.accept=".json";inp2.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(Array.isArray(d)&&d[0]?.events){setClocks(d.map(c=>({...c,categories:(c.categories||[]).map(ct=>({...ct,visible:ct.visible!==false})),settings:c.settings||DS})));setAcId(d[0].id)}}catch{}};r.readAsText(f)};inp2.click()};
  const startEditName=()=>{setNameVal(clock.name);setEditName(true)};
  const saveName=()=>{if(nameVal.trim()){upd({name:nameVal.trim()});setEditName(false)}};

  if(showOB)return<Onboarding onComplete={onOB}/>;
  if(!clock)return null;

  return(<div style={{minHeight:"100vh",background:th.bg,fontFamily:"'DM Sans',sans-serif",color:th.text,transition:"background 0.3s, color 0.3s"}}>
    <header style={{height:50,padding:"0 14px",borderBottom:`1px solid ${th.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",background:th.card,gap:8}}>
      <div style={{display:"flex",alignItems:"center",gap:7}}>
        <button onClick={()=>setShowSB(!showSB)} style={{background:"none",border:"none",color:th.muted,cursor:"pointer",fontSize:15,padding:"3px 6px"}}>☰</button>
        <div style={{width:26,height:26,borderRadius:6,background:"linear-gradient(135deg,#5B5EA6,#3A8FCD)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:11,fontWeight:800}}>◎</div>
        {/* Inline name edit */}
        {editName?<div style={{display:"flex",gap:4,alignItems:"center"}}>
          <input value={nameVal} onChange={e=>setNameVal(e.target.value)} style={{...inp,marginBottom:0,width:180,fontSize:13,padding:"4px 8px",background:th.cardAlt,color:th.text,borderColor:th.border}} autoFocus onKeyDown={e=>{if(e.key==="Enter")saveName();if(e.key==="Escape")setEditName(false)}}/>
          <button onClick={saveName} style={{background:"none",border:"none",cursor:"pointer",color:"#22C55E",fontSize:14}}>✓</button>
          <button onClick={()=>setEditName(false)} style={{background:"none",border:"none",cursor:"pointer",color:th.sub,fontSize:14}}>✕</button>
        </div>:<button onClick={startEditName} style={{background:"none",border:"none",cursor:"pointer",fontFamily:"inherit",fontWeight:800,fontSize:14,color:th.text,padding:0}} title="Klikkaa muokataksesi nimeä">{clock.name} <span style={{fontSize:10,color:th.sub}}>✎</span></button>}
      </div>
      <div style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap"}}>
        {/* View mode toggle */}
        <div style={{display:"flex",borderRadius:6,overflow:"hidden",border:`1px solid ${th.border}`,marginRight:4}}>
          {[["clock","◎"],["timeline","⏐"],["list","≡"]].map(([v,ic])=><button key={v} onClick={()=>setView(v)} title={v==="clock"?"Kello":v==="timeline"?"Aikajana":"Lista"} style={{padding:"4px 10px",border:"none",fontSize:12,fontWeight:700,fontFamily:"inherit",cursor:"pointer",background:view===v?"#5B5EA6":th.card,color:view===v?"#fff":th.muted}}>{ic}</button>)}
        </div>
        {clocks.length>1&&clocks.map(c=><button key={c.id} onClick={()=>{setAcId(c.id);setSelM(null)}} style={{fontSize:9,padding:"3px 8px",borderRadius:5,border:c.id===acId?"none":`1px solid ${th.border}`,background:c.id===acId?"#5B5EA6":th.card,color:c.id===acId?"#fff":th.muted,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{c.name}</button>)}
        <button onClick={addClock} style={{fontSize:10,padding:"3px 8px",borderRadius:5,border:`1px solid ${th.border}`,background:th.card,color:th.muted,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>+</button>
        <div style={{width:1,height:16,background:th.border,margin:"0 2px"}}/>
        <button onClick={()=>setShowShare(true)} style={{fontSize:10,padding:"3px 10px",borderRadius:5,border:"none",background:"#5B5EA6",color:"#fff",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>🔗</button>
        <button onClick={importData} style={{fontSize:10,padding:"3px 8px",borderRadius:5,border:`1px solid ${th.border}`,background:th.card,color:th.muted,cursor:"pointer",fontFamily:"inherit"}}>📂</button>
        <button onClick={()=>handlePrint(clock.name,fEv,clock.categories)} style={{fontSize:10,padding:"3px 8px",borderRadius:5,border:`1px solid ${th.border}`,background:th.card,color:th.muted,cursor:"pointer",fontFamily:"inherit"}}>🖨</button>
        <button onClick={()=>{if(confirm("Nollaa?")){localStorage.removeItem(SK);setClocks([]);setShowOB(true)}}} style={{fontSize:8,padding:"3px 6px",borderRadius:5,border:`1px solid ${th.border}`,background:th.card,color:"#ef4444",cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>Nollaa</button>
      </div>
    </header>

    <div style={{display:"flex",height:"calc(100vh - 50px)"}}>
      <Sidebar clock={clock} onUpdate={upd} onMonthClick={m=>setSelM(selM===m?null:m)} selectedMonth={selM}
        showSB={showSB} setShowSB={setShowSB} setShowCat={setShowCat} setShowSett={setShowSett} theme={th}/>

      <div style={{flex:1,overflowY:"auto",padding:"14px 18px"}}>
        <div style={{display:"flex",justifyContent:"flex-end",marginBottom:10,gap:5}}>
          <button onClick={()=>setShowCat(true)} style={{fontSize:10,padding:"4px 10px",borderRadius:6,border:`1px solid ${th.border}`,background:th.card,color:th.muted,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>🏷 Kehät</button>
          <button onClick={()=>setShowSett(true)} style={{fontSize:10,padding:"4px 10px",borderRadius:6,border:`1px solid ${th.border}`,background:th.card,color:th.muted,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>⚙️</button>
          <button onClick={()=>setEditEv({month:selM??new Date().getMonth()})} style={{fontSize:10,padding:"4px 14px",borderRadius:6,border:"none",background:"#5B5EA6",color:"#fff",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>+ Tapahtuma</button>
        </div>

        {view==="clock"&&<CircularClock events={fEv} categories={clock.categories.filter(c=>c.visible)} onMonthClick={m=>setSelM(selM===m?null:m)} onEventClick={ev=>setEditEv(ev)} clockTitle={clock.name} selectedMonth={selM} settings={clock.settings||DS} theme={th}/>}
        {view==="timeline"&&<TimelineView events={fEv} categories={clock.categories.filter(c=>c.visible)} onEventClick={ev=>setEditEv(ev)} clockTitle={clock.name} theme={th}/>}
        {view==="list"&&<ListView events={fEv} categories={clock.categories} onMonthClick={m=>setSelM(selM===m?null:m)} onEventClick={ev=>setEditEv(ev)} theme={th}/>}

        {selM!==null&&view!=="timeline"&&<MonthPanel month={selM} events={fEv} categories={clock.categories} onAdd={m=>setEditEv({month:m})} onEdit={ev=>setEditEv(ev)} onDelete={delEv} onClose={()=>setSelM(null)} theme={th}/>}
      </div>
    </div>

    {editEv&&<EventModal event={editEv.id?editEv:null} month={editEv.month} categories={clock.categories} onSave={saveEv} onCancel={()=>setEditEv(null)} theme={th}/>}
    {showCat&&<CatModal categories={clock.categories} onSave={cats=>{upd({categories:cats.map(c=>({...c,visible:c.visible!==false}))});setShowCat(false)}} onCancel={()=>setShowCat(false)} theme={th}/>}
    {showSett&&<SettModal settings={clock.settings||DS} onSave={s=>{upd({settings:s});setShowSett(false)}} onCancel={()=>setShowSett(false)} theme={th}/>}
    {showShare&&<ShareModal clock={clock} onClose={()=>setShowShare(false)} theme={th}/>}
    {toast&&<div className="toast">{toast}</div>}
  </div>);
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
